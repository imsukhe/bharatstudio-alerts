# Declarative Cloud Tasks starting point. Apply only from the release pipeline
# after private ingress/IAM and staging retry/DLQ rehearsal are approved.
queues:
  - name: bsa-alert-delivery
    retryConfig:
      maxAttempts: 20
      maxRetryDuration: 86400s
      maxBackoff: 300s
      maxDoublings: 8
    deadLetterPolicy:
      maxAttempts: 20
      deadLetterQueue: projects/PROJECT/locations/REGION/queues/bsa-alert-delivery-dlq
  - name: bsa-alert-delivery-dlq
    retryConfig:
      maxAttempts: 5
      maxRetryDuration: 604800s
      maxBackoff: 3600s
      maxDoublings: 8

    HistoryItem:
      type: object
      additionalProperties: false
      required: [eventId, sourceType, status, createdAt]
      properties:
        eventId: { type: string, format: uuid }
        sourceType: { type: string, enum: [payment, manual, companion] }
        status: { type: string, enum: [accepted, held, displayed, acknowledged, failed, quarantined, suppressed] }
        createdAt: { type: string, format: date-time }
        grossAmountPaise: { type: [integer, 'null'], minimum: 0 }
        currency: { type: [string, 'null'], const: INR }
        displayName: { type: [string, 'null'], maxLength: 80 }
        message: { type: [string, 'null'], maxLength: 500 }
    ModerationRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [approve, hold, suppress, replay] }
        reason: { type: [string, 'null'], maxLength: 240 }
    ModerationResult:
      type: object
      additionalProperties: false
      required: [schemaVersion, eventId, action, appliedAt]
      properties:
        schemaVersion: { type: string, const: v1 }
        eventId: { type: string, format: uuid }
        action: { type: string, enum: [approve, hold, suppress, replay] }
        appliedAt: { type: string, format: date-time }
    BillingView:
      type: object
      additionalProperties: false
      required: [schemaVersion, channelId, tier, monthlyPricePaise, annualMonthsCharged, annualServiceMonths, renewalState, billingInterval, autoRenew, currentPeriodEndsAt, priceProtectedUntil, priceSource]
      properties:
        schemaVersion: { type: string, const: v1 }
        channelId: { type: string, format: uuid }
        tier: { type: string, enum: [free, pro, creator, studio] }
        monthlyPricePaise: { type: integer, minimum: 0 }
        annualMonthsCharged: { type: integer, const: 10 }
        annualServiceMonths: { type: integer, const: 12 }
        renewalState: { type: string, enum: [not_applicable, active, past_due, cancelled] }
        nextRenewalAt: { type: [string, 'null'], format: date-time }
        billingInterval: { type: string, enum: [monthly, annual] }
        autoRenew: { type: boolean }
        currentPeriodEndsAt: { type: [string, 'null'], format: date-time }
        priceProtectedUntil: { type: [string, 'null'], format: date-time }
        priceSource: { type: string, enum: [current, grandfathered] }
    CreateBillingSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [tier, billingInterval]
      properties:
        tier: { type: string, enum: [pro, creator, studio] }
        billingInterval: { type: string, enum: [monthly, annual] }
    BillingSubscriptionResult:
      type: object
      additionalProperties: false
      required: [schemaVersion, provider, status, subscriptionId, tier, billingInterval, monthlyPricePaise, annualChargePaise, annualMonthsCharged, annualServiceMonths, checkoutUrl]
      properties:
        schemaVersion: { type: string, const: v1 }
        provider: { type: string, const: razorpay }
        status: { type: string, enum: [linked, pending] }
        subscriptionId: { type: string }
        tier: { type: string, enum: [pro, creator, studio] }
        billingInterval: { type: string, enum: [monthly, annual] }
        monthlyPricePaise: { type: integer, minimum: 1 }
        annualChargePaise: { type: integer, minimum: 1 }
        annualMonthsCharged: { type: integer, const: 10 }
        annualServiceMonths: { type: integer, const: 12 }
        checkoutUrl: { type: [string, 'null'], format: uri }
    CompanionState:
      type: object
      additionalProperties: false
      required: [schemaVersion, channelId, overlayConnected, pendingAlerts, lastUpdatedAt]
      properties:
        schemaVersion: { type: string, const: v1 }
        channelId: { type: string, format: uuid }
        overlayConnected: { type: boolean }
        pendingAlerts: { type: integer, minimum: 0 }
        lastUpdatedAt: { type: string, format: date-time }
    CompanionActionSlot:
      type: object
      additionalProperties: false
      required: [slotIndex, page, label, action, targetId]
      properties:
        slotIndex: { type: integer, minimum: 1, maximum: 64 }
        page: { type: integer, minimum: 1, maximum: 16 }
        label: { type: string, minLength: 1, maxLength: 80 }
        action: { type: string, enum: [pause_queue, resume_queue, send_test_alert] }
        targetId: { type: string, format: uuid }
    CompanionLayout:
      type: object
      additionalProperties: false
      required: [schemaVersion, channelId, version, tier, maxSlots, pageSize, slots, createdAt]
      properties:
        schemaVersion: { type: string, const: v1 }
        channelId: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        tier: { type: string, enum: [free, pro, creator, studio] }
        maxSlots: { type: integer, enum: [8, 16, 32, 64] }
        pageSize: { type: integer, enum: [4, 8, 16] }
        slots:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/CompanionActionSlot'
        createdAt: { type: [string, 'null'], format: date-time }
    CompanionActionRequest:
      type: object
      additionalProperties: false
      required: [action, targetId]
      properties:
        action: { type: string, enum: [pause_queue, resume_queue, send_test_alert] }
        targetId: { type: string, format: uuid, description: Queue target required for every v1 Companion action. }
    CompanionActionResult:
      type: object
      additionalProperties: false
      required: [schemaVersion, commandId, status, acceptedAt]
      properties:
        schemaVersion: { type: string, const: v1 }
        commandId: { type: string, format: uuid }
        status: { type: string, enum: [accepted, rejected] }
        acceptedAt: { type: string, format: date-time }
        eventId: { type: string, format: uuid, description: Present for send_test_alert commands and identifies the durable synthetic alert event. }
    CompanionControlSessionRequest:
      type: object
      additionalProperties: false
      required: [clientType, clientInstanceId]
      properties:
        clientType: { type: string, enum: [web, mobile, desktop] }
        clientInstanceId: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    CompanionControlSession:
      type: object
      additionalProperties: false
      required: [schemaVersion, sessionId, channelId, clientType, clientInstanceId, leaseUntil, createdAt, reused]
      properties:
        schemaVersion: { type: string, const: v1 }
        sessionId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        clientType: { type: string, enum: [web, mobile, desktop] }
        clientInstanceId: { type: string, minLength: 16, maxLength: 128 }
        leaseUntil: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        reused: { type: boolean }
    ChannelMembership:
      type: object
      additionalProperties: false
      required: [channelId, role]
      properties:
        channelId: { type: string, format: uuid }
        role: { type: string, enum: [owner, admin, operator, moderator, viewer] }
    EntitlementResult:
      type: object
      additionalProperties: false
      required: [schemaVersion, channelId, tier, source, entitlementVersion, values]
      properties:
        schemaVersion: { type: string, const: v1 }
        channelId: { type: string, format: uuid }
        tier: { type: string, enum: [free, pro, creator, studio] }
        source: { type: string, enum: [individual_plan] }
        entitlementVersion: { type: integer, minimum: 1 }
        values: { type: object, additionalProperties: true }
    OverlaySession:
      type: object
      additionalProperties: false
      required: [schemaVersion, overlayId, expiresAt, streamUrl]
      properties:
        schemaVersion: { type: string, const: v1 }
        overlayId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        streamUrl:
          type: string
          format: uri
          description: >-
            Web overlay HTML URL for an OBS Browser Source. The short-lived
            credential must be carried only in the URL fragment; this URL must
            contain no query credential and the API SSE endpoint must be
            reached by the page with an Authorization bearer header.
    OverlaySseEvent:
      type: object
      additionalProperties: false
      required: [schemaVersion, cursor, eventId, eventType, traceId, createdAt, payload]
      properties:
        schemaVersion: { type: string, const: v1 }
        cursor: { type: string, minLength: 1, maxLength: 256 }
        eventId: { type: string, format: uuid }
        eventType: { type: string, enum: [alert.ready, alert.update, alert.hold, alert.complete, resync.required] }
        traceId: { type: string, minLength: 1, maxLength: 128 }
        createdAt: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    OverlayCursorAcknowledgement:
      type: object
      additionalProperties: false
      required: [cursor, eventId]
      properties:
        cursor: { type: string, minLength: 1, maxLength: 256 }
        eventId: { type: string, format: uuid }
    InternalJobRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, jobId, requestedAt]
      properties:
        schemaVersion: { type: string, const: v1 }
        jobId: { type: string, format: uuid }
        requestedAt: { type: string, format: date-time }
        cursor: { type: [string, 'null'], maxLength: 256 }

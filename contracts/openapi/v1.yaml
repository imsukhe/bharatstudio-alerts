        '200':
          description: Authorised operational state for the Web Companion Console.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/channels/{channelId}/companion/layout:
    get:
      tags: [Companion]
      operationId: getCompanionLayout
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Server-owned Companion layout and tier allocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionLayout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Companion]
      operationId: updateCompanionLayout

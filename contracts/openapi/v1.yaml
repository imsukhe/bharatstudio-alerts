        giveaway id is required so the write is addressed rather than ambient - a stale
        dashboard tab cannot write a count onto a giveaway opened after that tab loaded. The
        count is creator-reported because there is no entry path in this slice; deriving it
        would mean building the entry subsystem, which is the whole of 17. An unknown,
        already-closed, other-channel or unauthorised giveaway is one indistinguishable 404.
      parameters:
        - $ref: '#/components/parameters/ChannelId'

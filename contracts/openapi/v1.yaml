  /v1/overlays/{overlayId}/events:
    get:
      tags: [Overlay]
      operationId: streamOverlayEvents
      security: [{ overlayToken: [] }]
      parameters:
        - name: overlayId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Last-Event-ID
          in: header
          required: false
          description: >-
            Accepted, and DELIBERATELY NOT a resume point. `EventSource` sends this header
            automatically on every reconnect, so most clients send it without choosing to; it is
            read, validated for shape, and then has no effect on which events come back. Replay is
            not positional. A client must not assume events before this cursor are withheld, and
            must remain able to receive one it has already seen.

            Why, because the alternative looks safer and is not: deliveries are published out of
            order (task enqueueing, network delivery and worker execution all complete out of
            order), so filtering by cursor POSITION can strand an older, still-unacknowledged
            delivery permanently once a newer one is acknowledged. Acknowledgement, not position,
            is the eligibility filter - the read admits only 'ready' and 'displayed' deliveries and
            excludes 'acknowledged' outright. See migration 0055, whose header states the rule, and
            0137, which removed the two cursor parameters the SQL had ignored since 0064.

            Documented here by owner decision 2026-09-16 after this field's previous description
            ("Durable replay cursor returned by the previous SSE event") was found to assert the
            opposite of the behaviour. Nothing about the behaviour changed; the contract had been
            wrong, not the server.
          schema: { type: string, maxLength: 256 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Server-sent overlay events.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Overlay-Stream-Version:
              schema: { type: string }
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames whose data validates as OverlaySseEvent.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: Cursor is outside the replay window; client must resync.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/overlays/{overlayId}/cursor:

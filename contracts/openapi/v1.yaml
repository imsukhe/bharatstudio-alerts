  /v1/overlay-widgets/{overlayId}/moderator-status:
    get:
      tags: [Overlay]
      operationId: getOverlayModeratorStatus
      summary: Held alert deliveries awaiting a moderator, plus the channel's safe-mode state.
      description: >-
        Master Canvas module #12 (Moderator Status Card). Returns the number of this channel's alert
        deliveries currently held for a moderator's decision, and whether the creator's safe-mode
        switch is on. It carries a COUNT and a BOOLEAN and nothing else - no supporter name, message
        text, amount, delivery id, event id, queue id, payment reference or viewer identifier - and
        that is enforced by the read itself, whose returned column set is exactly those two values.
        safeMode is the creator's own per-channel moderation switch: while it is on, incoming alerts
        route to held rather than ready. It is never automatic - no spike detection, no
        rejection-rate heuristic, no signal of any kind engages it - and it is NOT the queue-paused
        flag, which this read still never touches. This route is read-only; the switch is changed
        through the creator's own /v1/channels/{channelId}/safe-mode surface. moderatorStatus is
        null when the overlay token is not recognised; a recognised token with nothing held and safe
        mode off returns heldCount 0 and safeMode false.
      security: [{ overlayToken: [] }]
      parameters:
        - $ref: '#/components/parameters/OverlayId'
      responses:
        '200':
          description: Token-scoped held-delivery count and safe-mode state for this overlay, or null when unavailable for this overlay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverlayModeratorStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/overlay-widgets/{overlayId}/reaction-cloud:
    get:
      tags: [Overlay]
      operationId: getOverlayReactionCloud
      summary: A server-side sampled, non-identifying cloud of viewer reactions.
      description: >-
        Master Canvas module #5 (Reaction Cloud). A reaction is a send of an entry from the
        EXISTING curated sticker catalogue - first-party entries plus staff-reviewed creator
        packs - so nothing here is a new asset, a new catalogue or a viewer upload.

        Sampling is server-side (19.5): the read aggregates every reaction into one row per
        catalogue entry and applies the configured display ceiling inside the database, before
        anything reaches this endpoint. A client is never sent the reaction stream and then
        asked to drop part of it, and the response is a bounded projection rather than a
        history (12.7). The ceiling ships configured but unset; unset means no ceiling beyond
        the read's own structural bound.

        Non-identifying is a property of the read, not of the renderer: the returned column set
        is the catalogue entry's source, id and display name plus a count. No viewer id,
        anonymous identity token, session id, IP address, or timestamp of any precision exists
        on this path. An unrecognised, expired, revoked or foreign overlay token returns an
        empty entries array, which is also what a quiet channel returns.
      security: [{ overlayToken: [] }]
      parameters:
        - $ref: '#/components/parameters/OverlayId'
      responses:
        '200':
          description: Token-scoped, server-side sampled reaction cloud for this overlay, possibly empty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverlayReactionCloudResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/public/channels/{handle}/reactions:
    post:
      tags: [Public]
      operationId: sendPublicChannelReaction
      summary: Send a reaction from the public tip page.
      description: >-
        Public and unauthenticated, like the rest of the tip page. Free reactions are available
        at every tier (30.3), and requiring a viewer account would contradict module #5's own
        non-identifying rule - an account is an identity. The existing public-surface bot
        verification applies behind the same configuration flag as the public payment
        endpoints; no new authentication model is introduced, and no viewer identity is read,
        issued or stored.

        Rate limiting is per SENDER - 60 sends per minute - enforced in the database against a
        one-minute window. It is deliberately NOT per channel: a channel-level cap throttles the
        creator, because a popular stream exhausts the budget and then refuses legitimate
        viewers. A creator's reaction throughput therefore scales with their audience and no
        channel budget can cap it, and the creator's alert-source rateLimitPerMinute setting is
        not read by this path at all. When the limit is reached the request is refused with 429
        reaction_rate_limited and nothing is recorded; one sender's exhausted budget never
        affects another sender on the same channel.

        The sender key is the existing anonymous browser identity: the server reads the
        __Host-bsa-anonymous cookie the public checkout endpoints already use, issues one when
        absent, and keys the limit on its SHA-256 fingerprint - resolved through the existing
        viewer-identity tables, and through the account identity when that browser has been
        claimed into an account. The raw token never reaches the database, no new identity row is
        ever created by a reaction, and the fingerprint is used for admission control ONLY: it is
        never stored on the reaction, never returned by any read, never logged and never used as
        a metric label. It is not an IP address - CGNAT means thousands of genuine viewers share
        one address, so an IP-keyed limit would refuse them as a group. A send whose sender
        cannot be resolved is refused with 400 reaction_sender_unidentified rather than accepted
        or downgraded to a weaker limit.

        The entry must already exist in the channel's live, enabled, tier-eligible curated
        catalogue at the moment of the send; existence, ownership, tier eligibility, the
        creator's enabled set and staff-review state are all re-checked server-side and a
        failure is an explicit rejection, never a silent drop.
      parameters:
        - $ref: '#/components/parameters/Handle'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicReactionSendRequest' }
      responses:
        '201':
          description: The reaction was recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicReactionSendResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/safe-mode:
    get:
      tags: [Moderation]
      operationId: getChannelSafeMode
      summary: Whether safe mode is on for this channel.
      description: >-
        Safe mode is a per-channel moderation state the creator turns on and off. While it is on,
        newly created alert deliveries for the channel are written held rather than ready, for the
        creator or a moderator to review through the existing moderation path. It is NEVER automatic
        - no spike detection, no rejection-rate heuristic, no threshold and no signal of any kind
        engages it - and it is NOT the queue-paused flag, which is a separate queue lifecycle state.
        Available at every tier: storing, viewing and changing a durable creator record is never
        tier-gated. The only gate is the owner/admin role on the channel, and a caller without it
        receives 404 rather than 403.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: The channel's current safe-mode state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelSafeModeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
    put:
      tags: [Moderation]
      operationId: setChannelSafeMode
      summary: Turn safe mode on or off for this channel.
      description: >-
        Idempotent. The body carries the value rather than requesting a toggle, so turning safe mode
        on and turning it off are one code path and a client that has lost track of the current
        state cannot flip it by accident. The body declares `enabled` and nothing else: safe mode is
        a switch, not a policy object, and a request carrying a threshold, window, duration, expiry,
        reason or trigger is rejected with 400 - those would be automatic-engagement mechanics the
        product deliberately does not have. TURNING SAFE MODE OFF RELEASES NOTHING - deliveries
        already held stay held and are reviewed individually through the existing moderation path;
        there is no bulk release, by decision.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelSafeModeRequest' }
      responses:
        '200':
          description: The channel's safe-mode state after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelSafeModeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }

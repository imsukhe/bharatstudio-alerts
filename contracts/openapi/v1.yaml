        Sets the channel's one sponsor card - the sponsor name, the show/hide toggle, an
        optional scheduled placement window, and optional logo metadata. Owner/admin only, and
        not tier-gated. There is no separate create/update verb: PUT always writes the
        channel's single row, and calling it twice upserts the same card rather than creating a
        second one. Disabling the card is enabled: false on the same call, not a separate
        delete.

        The body carries no field capable of counting, timing or accumulating anything about
        the card being displayed, and no field capable of carrying a remote URL, script,
        iframe or stylesheet onto the Master Canvas (9.1.1) - additionalProperties is false so
        a client cannot even attempt to write one.
      parameters:
        - $ref: '#/components/parameters/ChannelId'

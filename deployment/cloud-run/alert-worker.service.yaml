apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bharatstudio-alert-worker
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "4"
    spec:
      serviceAccountName: bsa-alert-worker
      containerConcurrency: 20
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/bharatstudio/alert-worker:RELEASE_DIGEST
          ports: [{ name: http1, containerPort: 8080 }]
          env:
            - name: ALERT_WORKER_DATABASE_URL
              valueFrom: { secretKeyRef: { name: bsa-worker-database-url, key: current } }
            - name: ALERT_WORKER_PRIVATE_AUDIENCE
              value: https://bharatstudio-alert-worker-PROJECT.REGION.run.app
            - name: ALERT_WORKER_PUMP_AUDIENCE
              value: https://bharatstudio-alert-worker-PROJECT.REGION.run.app
            - name: ALERT_WORKER_CLOUD_TASKS_QUEUE
              value: projects/PROJECT/locations/REGION/queues/bsa-alert-delivery
            - name: ALERT_WORKER_TASK_TARGET_URL
              value: https://bharatstudio-alert-worker-PROJECT.REGION.run.app/internal/v1/tasks/overlay
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5

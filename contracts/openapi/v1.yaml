  /v1/channels/{channelId}/tournament:
    get:
      tags: [Tournament]
      operationId: getChannelTournament
      security: [{ bearerAuth: [] }]
      description: >-
        The channel's current tournament, or null. Available at every tier (12.6). fieldSize,
        totalRounds and matchesInRound are derived from the referenced lobby session rather
        than stored - 17.2 builds tournaments ON the Lobby Engine rather than beside it.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: The channel's current tournament, or null when none is running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelTournamentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
    post:
      tags: [Tournament]
      operationId: startChannelTournament
      security: [{ bearerAuth: [] }]
      description: >-
        Starts a single-elimination tournament ON an open lobby session of the same channel
        (17.2). Owner/admin only, and not tier-gated. At most one may run per channel. The
        body carries the lobby session id and nothing else: the bracket's field size IS that
        lobby's seat count, so there is no field size, bracket size, capacity, seeding,
        participant list, team, score, sponsor slot, prize or entry fee to supply. A lobby
        whose seat count is not 2, 4 or 8 is a 400 - single elimination without byes needs a
        power of two, byes belong to seeding which is not built, and 30.3 caps the field at 8.
        An unknown, already-closed or other-channel lobby is a 404.
      parameters:

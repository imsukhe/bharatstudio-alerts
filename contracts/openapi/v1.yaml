openapi: 3.1.0
info:
  title: BharatStudio Alerts API
  version: 1.0.0-draft
  description: >-
    Draft v1 REST contract for BharatStudio Alerts and Companion. This contract
    is not approved for production until L01 review and verification pass.
servers:
  - url: https://api.example.invalid
    description: Placeholder only; production domain is not yet approved.
tags:
  - name: Auth
  - name: Viewer
  - name: Public
  - name: Creator
  - name: Configuration
  - name: Queues
  - name: Moderation
  - name: History
  - name: Billing
  - name: Overlay
  - name: Companion
  - name: Internal
paths:
  /healthz:
    get:
      tags: [Operations]
      operationId: getHealth
      responses:
        '200':
          description: Process liveness only; no runtime dependency, credential, user or database detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /readyz:
    get:
      tags: [Operations]
      operationId: getReadiness
      responses:
        '200':
          description: Every required runtime adapter is configured and available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessReadyResponse' }
        '503':
          description: Required runtime adapter configuration or availability is not ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessUnavailableResponse' }
  /v1/auth/google/exchange:
    post:
      tags: [Auth]
      operationId: exchangeGoogleIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleExchangeRequest'
      responses:
        '201':
          description: BharatStudio session created from a verified Google identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/viewer/signup:
    post:
      tags: [Viewer]
      operationId: signupViewer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewerSignupRequest' }
      responses:
        '201':
          description: Opaque viewer session created. This is not a creator session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViewerAuthSessionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/viewer/login:
    post:
      tags: [Viewer]
      operationId: loginViewer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewerLoginRequest' }
      responses:
        '201':
          description: Opaque viewer session created. Invalid credentials never identify which input failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViewerAuthSessionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/viewer/password/forgot:
    post:
      tags: [Viewer]
      operationId: requestViewerPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewerPasswordForgotRequest' }
      responses:
        '202':
          description: Fixed response for registered, unregistered, and temporarily failed requests; it never discloses account existence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViewerPasswordResetRequestedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/viewer/password/reset:
    post:
      tags: [Viewer]
      operationId: resetViewerPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewerPasswordResetRequest' }
      responses:
        '200':
          description: Password reset completed; callers must sign in again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViewerPasswordResetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/viewer/logout:
    post:
      tags: [Viewer]
      operationId: logoutViewer
      security: [{ viewerBearerAuth: [] }]
      responses:
        '204': { description: Current viewer session revoked; no content. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/viewer/sessions:
    get:
      tags: [Viewer]
      operationId: listViewerSessions
      security: [{ viewerBearerAuth: [] }]
      responses:
        '200':
          description: Session metadata scoped to the authenticated viewer account only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViewerSessionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/viewer/sessions/{sessionId}:
    delete:
      tags: [Viewer]
      operationId: revokeViewerSession
      security: [{ viewerBearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': { description: Scoped viewer session revoked; no content. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/viewer/deletion-requests:
    post:
      tags: [Viewer]
      operationId: requestViewerDeletion
      security: [{ viewerBearerAuth: [] }]
      responses:
        '202':
          description: Account-deletion request accepted with the disclosed erased-versus-retained categories.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViewerDeletionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/viewer/dashboard:
    get:
      tags: [Viewer]
      operationId: getViewerDashboard
      security: [{ viewerBearerAuth: [] }]
      responses:
        '200':
          description: The authenticated viewer's newest 100 creator-support relations only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViewerDashboardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/viewer/channels/{channelId}/badges:
    get:
      tags: [Viewer]
      operationId: getViewerChannelBadges
      security: [{ viewerBearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Live-derived support badges for the authenticated viewer and requested channel only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViewerChannelBadgesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/viewer/profile-visibility:
    put:
      tags: [Viewer]
      operationId: setViewerProfileVisibility
      security: [{ viewerBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewerProfileVisibilityRequest' }
      responses:
        '200':
          description: The authenticated viewer's resulting profile visibility state only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViewerProfileVisibilityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/public/channels/{handle}:
    get:
      tags: [Public]
      operationId: getPublicChannel
      parameters:
        - $ref: '#/components/parameters/Handle'
      responses:
        '200':
          description: Public channel presentation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicChannel'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/public/featured:
    get:
      tags: [Public]
      operationId: listFeaturedCreators
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 60 }
      responses:
        '200':
          description: Opt-in creators currently eligible to accept tips. This anonymous projection intentionally excludes channel IDs, consent state and financial data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturedCreatorList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/RetryableFailure'
  /v1/public/channels/{handle}/paid-votes:
    get:
      tags: [Public]
      operationId: listPublicPaidVotes
      parameters:
        - $ref: '#/components/parameters/Handle'
      responses:
        '200':
          description: Active paid support-vote choices for this channel. The projection intentionally excludes interaction configuration, payment tallies, and identity data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPaidVoteList' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/public/channels/{handle}/tips/orders:
    post:
      tags: [Public]
      operationId: createTipOrder
      parameters:
        - $ref: '#/components/parameters/Handle'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTipOrderRequest'
      responses:
        '201':
          description: Razorpay order created; payment is not considered captured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTipOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/RetryableFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/public/tip-orders/{orderId}/status:
    get:
      tags: [Public]
      operationId: getPublicTipOrderStatus
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Donor-safe server-confirmed payment state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTipOrderStatus'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me:
    get:
      tags: [Creator]
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated user and permitted channels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/sessions:
    get:
      tags: [Creator]
      operationId: listCurrentUserSessions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active sessions for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/sessions/{sessionId}:
    delete:
      tags: [Creator]
      operationId: revokeCurrentUserSession
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/notifications/preferences:
    get:
      tags: [Companion]
      operationId: getNotificationPreferences
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Account-scoped operational notification preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
    put:
      tags: [Companion]
      operationId: updateNotificationPreferences
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotificationPreferencesRequest' }
      responses:
        '200':
          description: Saved account-scoped preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/public/receipts:
    post:
      tags: [PublicDonor]
      operationId: mintPublicReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintReceiptRequest'
      responses:
        '201':
          description: Opaque receipt token minted for the payment intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintReceiptResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/public/receipts/{token}:
    get:
      tags: [PublicDonor]
      operationId: getPublicReceipt
      parameters:
        - $ref: '#/components/parameters/ReceiptToken'
      responses:
        '200':
          description: Token-scoped public receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicReceiptResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/public/tip-intents/{token}:
    get:
      tags: [PublicDonor]
      operationId: resolvePublicTipIntent
      parameters:
        - $ref: '#/components/parameters/TipIntentToken'
      responses:
        '200':
          description: Ready TipIntent detail or a used/expired identity-only state.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TipIntentReadyResponse'
                  - $ref: '#/components/schemas/TipIntentClosedResponse'
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/public/tip-intents/{token}/orders:
    post:
      tags: [PublicDonor]
      operationId: confirmPublicTipIntent
      parameters:
        - $ref: '#/components/parameters/TipIntentToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmTipIntentRequest'
      responses:
        '201':
          description: Payment-provider order created from the server-side TipIntent values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTipOrderResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/me/notifications/devices:
    get:
      tags: [Companion]
      operationId: listNotificationDevices
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Safe metadata for the caller's active notification devices; tokens are never returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationDeviceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
    put:
      tags: [Companion]
      operationId: registerNotificationDevice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterNotificationDeviceRequest' }
      responses:
        '200':
          description: Registered device metadata; the provider token is not returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationDevice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/me/notifications/devices/{deviceId}:
    delete:
      tags: [Companion]
      operationId: revokeNotificationDevice
      security: [{ bearerAuth: [] }]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Notification device revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels:
    post:
      tags: [Creator]
      operationId: createChannel
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: Channel created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/channels/{channelId}:
    get:
      tags: [Creator]
      operationId: getChannelDetails
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Channel details visible to the authenticated member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Creator]
      operationId: updateChannelDetails
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelRequest'
      responses:
        '200':
          description: Updated channel details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/channels/{channelId}/config:
    get:
      tags: [Configuration]
      operationId: getChannelConfig
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Versioned channel alert configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Configuration]
      operationId: updateChannelConfig
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelConfigRequest'
      responses:
        '200':
          description: New immutable configuration version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/channels/{channelId}/queues:
    get:
      tags: [Queues]
      operationId: listQueues
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Queues visible to the authenticated member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Queues]
      operationId: createQueue
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQueueRequest'
      responses:
        '201':
          description: Queue created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/channels/{channelId}/queues/{queueId}:
    patch:
      tags: [Queues]
      operationId: updateQueue
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/QueueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQueueRequest'
      responses:
        '200':
          description: Updated queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/channels/{channelId}/bindings:
    get:
      tags: [Queues]
      operationId: listQueueBindings
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Source-to-queue routing bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Queues]
      operationId: createQueueBinding
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBindingRequest'
      responses:
        '201':
          description: Binding created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueBinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/channels/{channelId}/bindings/{bindingId}:
    patch:
      tags: [Queues]
      operationId: updateQueueBinding
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - name: bindingId
          in: path

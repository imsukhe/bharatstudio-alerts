        schemaVersion: { type: string, const: v1 }
        bindingId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        queueId: { type: string, format: uuid }
        sourceType: { type: string, enum: [payment, manual, companion] }
        sourceId: { type: string, minLength: 1, maxLength: 160 }
        allowDuplicates: { type: boolean }
        priority: { type: integer, minimum: 0, maximum: 100000 }
        overrideValues: { $ref: '#/components/schemas/BindingOverrideValues' }
        active: { type: boolean }
    BindingList:
      type: object
      additionalProperties: false
      required: [schemaVersion, bindings]
      properties:
        schemaVersion: { type: string, const: v1 }
        bindings:
          type: array
          items: { $ref: '#/components/schemas/QueueBinding' }
    CreateBindingRequest:
      type: object
      additionalProperties: false
      required: [queueId, sourceType, sourceId, allowDuplicates, priority]
      properties:
        queueId: { type: string, format: uuid }
        sourceType: { type: string, enum: [payment, manual, companion] }
        sourceId: { type: string, minLength: 1, maxLength: 160 }
        allowDuplicates: { type: boolean }
        priority: { type: integer, minimum: 0, maximum: 100000 }
        overrideValues: { $ref: '#/components/schemas/BindingOverrideValues' }
    UpdateBindingRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        allowDuplicates: { type: boolean }
        priority: { type: integer, minimum: 0, maximum: 100000 }
        overrideValues: { $ref: '#/components/schemas/BindingOverrideValues' }
        active: { type: boolean }
    TestAlertRequest:
      type: object
      additionalProperties: false
      required: [displayName, message]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        message: { type: string, minLength: 1, maxLength: 500 }
        queueIds:
          type: array
          maxItems: 64
          items: { type: string, format: uuid }
    AlertAccepted:
      type: object
      additionalProperties: false
      required: [schemaVersion, eventId, traceId, status]
      properties:
        schemaVersion: { type: string, const: v1 }
        eventId: { type: string, format: uuid }
        traceId: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [accepted, held] }
    AlertHistoryPage:
      type: object
      additionalProperties: false
      required: [schemaVersion, items, nextCursor]

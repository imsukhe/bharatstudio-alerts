      description: >-
        Master Canvas module #17 (Giveaway / Tournament Card). 17.1's overlay list is "entry
        count, time remaining, winner announcement with consent, and a claim flow"; 17.2 adds
        a standings module. The entry count, the published window's close instant and the
        bracket progress ship. The rest does not, and that is the correct conclusion rather
        than an omission.

        NO WINNER, AND NONE IS POSSIBLE IN THIS SLICE. 17.1 permits an announcement only WITH
        CONSENT, and no consent mechanism exists in this schema; a winner is a participant
        identifier on an aggregate-only path; and nothing could produce one, because the
        mechanic is not built (17.1, decided 2026-09-13 - free-entry and skill-based formats
        only, supporter-weighted odds not built) and GIV-07 gates chance-based formats on a
        legal review that has not happened. GIV-07 stays Blocked and nothing here touches it.

        NO CHANCE MECHANIC OF ANY KIND exists at any layer: no draw, seed, odds, weighting or
        shuffle. NO PRIZE, ESCROW, CUSTODY, FULFILMENT, DELIVERY, ADDRESS OR CLAIM field
        exists either - BharatStudio never holds, escrows, ships or guarantees a prize, and
        the creator is the promoter, responsible for eligibility, taxes and delivery. There is
        never a paid entry, which holds by construction because there is no entry path at all.

        Aggregate state only, and that is a property of the read rather than of the renderer:
        the returned column set is six aggregate values. No participant identifier, in-game
        name, Discord name, viewer id, anonymous identity, session id or contact detail exists
        on this path - and none exists in the schema behind it either, so there is nothing for
        a future read to start returning and nothing that can correlate one visit to another.
        The bracket is PROGRESS, never a tree: a tree needs participant labels, which 16 ruled
        need an opt-in mechanism that does not exist.

        Single elimination only, with a field of 2, 4 or 8. 30.3 places "single elim, up to 8"
        at Creator+ and double elimination, round robin, points tables and seeding at Studio,
        and this slice carries one entitlement gate rather than two. totalRounds and
        matchesInRound are derived at read time from the referenced lobby session's seat count
        (17.2: tournaments are built ON the Lobby Engine rather than beside it), so the
        bracket's field size has no second copy to drift.

        Bounded to current state and never a history (12.7). Entitlement is Creator+ or the
        Events Pack (30.3): the check is migration 0140's app_private.events_pack_entitled,
        called from inside this read rather than reimplemented, so an unentitled channel's
        valid overlay token returns null. An unrecognised, expired, revoked or foreign token
        returns null too, as do a channel with nothing running and a concluded tournament -
        all of them mean paint nothing, and there is deliberately no terminal state.
      security: [{ overlayToken: [] }]
      parameters:
        - $ref: '#/components/parameters/OverlayId'
      responses:
        '200':
          description: Token-scoped aggregate giveaway and tournament state for this overlay, or null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverlayGiveawayTournamentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/overlay-widgets/{overlayId}/sponsor-card:
    get:
      tags: [Overlay]
      operationId: getOverlaySponsorCard
      summary: The sponsor's name and, optionally, a logo reference - and nothing about display.
      description: >-
        Master Canvas module #11 (Sponsor Card). The card renders the sponsor and COUNTS
        NOTHING (owner decision, 2026-09-17) - the exposure event log named in the original
        catalogue row is DROPPED, not narrowed. There is no impression, exposure, view,
        duration, "shown at" or "displayed at" field anywhere on this path, and none exists in
        the schema behind it either. Building one later is a new decision requiring legal
        review, not an extension of this one.

        A row is returned ONLY when the card is currently supposed to be visible: enabled, and
        inside its schedule window if it has one. Disabled, outside the window, an
        unrecognised/expired/revoked/foreign token, and a channel with no sponsor card at all
        all answer 200 with sponsorCard null - every one of them means paint nothing.

        The logo, when present, is a tenant-scoped content-addressed asset reference
        (channel id + sha256, 19.1) - never a URL, never third-party content, and nothing
        capable of reaching the Master Canvas as a script, iframe or stylesheet (9.1.1).
      security: [{ overlayToken: [] }]
      parameters:
        - $ref: '#/components/parameters/OverlayId'
      responses:
        '200':
          description: Token-scoped sponsor card for this overlay, or null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverlaySponsorCardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/giveaway:

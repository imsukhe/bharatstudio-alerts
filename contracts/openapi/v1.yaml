          description: The started tournament.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelTournamentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/tournament/{tournamentId}:
    patch:
      tags: [Tournament]
      operationId: setChannelTournamentProgress
      security: [{ bearerAuth: [] }]
      description: >-
        Reports which round the bracket is in and how many of that round's matches are
        complete. Owner/admin only, and not tier-gated. Both values are required together,
        because they are read together on one card: a partial write would paint a round from
        one moment beside a match count from another. The exact bounds come from the
        REFERENCED LOBBY - the round ceiling is log2(seatCount) and the match ceiling is
        seatCount >> round - so a value outside them is a 400. No score, pairing, result,
        winner or dispute note is accepted: those are TRN-04 and need match rows, which do not
        exist in this slice. An unknown, already-concluded, other-channel or unauthorised
        tournament is one indistinguishable 404.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/TournamentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTournamentProgressRequest' }
      responses:
        '200':
          description: The updated tournament.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelTournamentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/tournament/{tournamentId}/conclude:
    post:
      tags: [Tournament]
      operationId: concludeChannelTournament
      security: [{ bearerAuth: [] }]
      description: >-
        Concludes the named tournament. Owner/admin only, and not tier-gated. Concluding
        deletes nothing - the record stays durable and readable (12.6) - and ANNOUNCES
        nothing: the overlay simply stops having anything to paint. There is deliberately no
        terminal state, because a terminal label on a bracket is a winner announcement with
        the name left out, and a winner announcement requires consent (17.1) that no mechanism
        in this schema provides. An unknown, already-concluded, other-channel or unauthorised
        tournament is one indistinguishable 404.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/TournamentId'
      responses:
        '204':
          description: The tournament was concluded. No result is produced.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/overlay-widgets/{overlayId}/media-queue:
    get:
      tags: [Overlay]
      operationId: getOverlayMediaQueue
      summary: The current and next queued media item, and nothing deeper in the queue.
      description: >-
        Master Canvas module #20 (Media / Meme Queue). CREATOR-ONLY (owner decision,
        2026-09-17; register row MED-20): the creator queues their own media and viewers
        cannot submit. There is no submission endpoint, no approval queue and no viewer-facing
        write surface anywhere in this product - this route is read-only by construction.

        AT MOST TWO ENTRIES, labelled "current" and "next", and nothing else. 12.7's Overlay
        row authorises "current and next alert state" in those exact words, and this reuses
        the identical bound
        apps/web/app/overlay/canvas/modules/support-theater-module.ts already established for
        this codebase rather than inventing a queue-depth number: there is no aggregate count
        of how many items are queued, so an overlay token cannot learn how deep the rotation
        is.

        Metadata only (19.1), and NO ARBITRARY THIRD-PARTY ORIGIN (9.1.1, migration 0148):
        playbackUrl and thumbnailPlaybackUrl are resolved server-side from a content-key
        fragment against the API's OWN configured CDN base - never a caller- or
        database-supplied host - and are null whenever that base is unset, which is every
        environment today; a null playbackUrl means the module renders nothing for that item.
        mimeType is a closed allow-list - no text/html, no image/svg+xml, no application/* of
        any kind (9.1.1) - so nothing on this path can ever carry a script, an iframe or a
        stylesheet onto the Master Canvas.

        No item id, no submitter identity and no viewer identity exists on this path - not
        withheld, but absent from the underlying read's declared result type, so nothing here
        can correlate one visit to another. An unrecognised, expired, revoked or foreign token
        returns an empty array, and so does a channel with nothing live in rotation - both mean
        paint nothing.
      security: [{ overlayToken: [] }]
      parameters:
        - $ref: '#/components/parameters/OverlayId'
      responses:
        '200':
          description: At most two token-scoped media queue entries (current and next) for this overlay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverlayMediaQueueResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/media-queue:
    get:
      tags: [MediaQueue]
      operationId: listChannelMediaQueue
      security: [{ bearerAuth: [] }]
      description: >-
        The creator's own durable media queue, every status and every enabled/disabled item,
        forever (12.6) - never tier-gated. Paginated with the same cursor-safety ceiling
        migration 0137's cursor reads already use (at most 100 per page), an engineering
        pagination floor rather than a product-decided queue depth.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: The channel's media queue items, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelMediaQueueListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
    post:
      tags: [MediaQueue]
      operationId: enqueueChannelMediaQueueItem
      security: [{ bearerAuth: [] }]
      description: >-
        Queues one media item. Owner/admin only, and not tier-gated. THIS IS THE ONLY WRITE
        SURFACE IN THE PRODUCT FOR THIS TABLE: there is no submission endpoint, no approval
        queue and no viewer-facing write anywhere else - additionalProperties: false means a
        body carrying submitterId, submittedBy, viewerId, approved, approvalStatus or
        rejectionReason is a 400 before the store is ever called, because none of those fields
        is declared here. mimeType is a closed allow-list (9.1.1); gcsObjectKey and
        thumbnailGcsObjectKey are content-KEY fragments, never URLs (19.1, 9.1.1, migration
        0148) - mirroring migration 0143's soundboard character-set shape exactly, so a value
        carrying a scheme or a host (any URL) is refused with 400 before the SQL layer's own
        identical CHECK constraint is ever reached; this is the fix for a prior hostile-review
        finding that this route accepted an arbitrary remote origin. durationMs and the
        maximum number of items a channel may queue at once are each governed by a
        CONFIGURED-BUT-UNSET deployment cap: unset means today's behaviour, with no additional
        ceiling beyond durationMs being non-negative. A cap being exceeded is a 409, never a
        400, so a client can tell "invalid" from "queue is full" apart.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnqueueMediaQueueItemRequest' }
      responses:
        '201':
          description: The queued media item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelMediaQueueItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/media-queue/{itemId}:
    patch:
      tags: [MediaQueue]
      operationId: updateChannelMediaQueueItem
      security: [{ bearerAuth: [] }]
      description: >-
        Renames a media queue item and/or toggles its enabled (pause) switch. Owner/admin
        only, and not tier-gated. Disabling an item is never a delete (12.6): the durable row
        stays exactly as it is and simply stops appearing in the overlay's live rotation. An
        unknown, other-channel or unauthorised item is one indistinguishable 404.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MediaQueueItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMediaQueueItemRequest' }
      responses:
        '200':
          description: The updated media queue item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelMediaQueueItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/media-queue/{itemId}/status:
    patch:
      tags: [MediaQueue]
      operationId: setChannelMediaQueueItemStatus
      security: [{ bearerAuth: [] }]
      description: >-
        Sets a media queue item's PLAYBACK status - queued, played or skipped - and never a
        moderation decision: approved/rejected/pending_review-shaped values are rejected by
        the enum itself. Owner/admin only, and not tier-gated. Marking an item played or
        skipped does not delete it (12.6): it stops appearing in the overlay's live rotation
        and stays in the creator's own durable list forever. An unknown, other-channel or
        unauthorised item is one indistinguishable 404.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MediaQueueItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetMediaQueueItemStatusRequest' }
      responses:
        '200':
          description: The media queue item with its updated status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelMediaQueueItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/overlay-widgets/{overlayId}/safe-soundboard:
    get:
      tags: [Overlay]
      operationId: getOverlaySafeSoundboard
      summary: The single most recent creator-triggered soundboard play.
      description: >-
        Master Canvas module #6 (Safe Soundboard Alert). The name describes the PLAYBACK
        being safe for a broadcast, never the CONTENT being vetted - no field here, and no
        field anywhere in this API, may claim a clip is safe, approved, checked, reviewed,
        vetted or curated. A creator's own uploaded clip plays with no review step.

        Seven fields and nothing else: playId (an opaque event id for client-side
        de-duplication only, never an identity), clipKind, displayName, playbackUrl,
        mimeType, durationSeconds and triggeredAt. No viewer, supporter or session identifier
        exists on this path, and none exists in the schema behind it either.

        playbackUrl is resolved by the API from a content-addressed GCS object key against
        the server's OWN configured CDN base (19.1) - never a caller- or database-supplied
        URL - and is null whenever that base is not configured, which is every environment
        today. Duration and file-size upload caps are likewise configured but unset: the
        upload path they gate is inert until a value exists, never treated as unlimited.

        QUEUE, STATED PLAINLY: this returns the single most recent trigger, not a never-drop
        queue - the overlay client remembers the last playId it has played and treats a
        repeat as a no-op. No cooldown is applied; none is decided anywhere in this
        repository. There is no supporter-triggered path in this slice (AUD-03 stays open) -
        every trigger here is the creator's own.

        Entitlement is Pro or above (30.3 "Sound Moments (catalogue)"): the check is
        migration 0143's app_private.soundboard_module_entitled, called from inside this
        read rather than reimplemented, so an unentitled channel's valid overlay token
        returns null - as do an unrecognised, expired, revoked or foreign token and a
        channel that has triggered nothing.
      security: [{ overlayToken: [] }]
      parameters:
        - $ref: '#/components/parameters/OverlayId'
      responses:
        '200':
          description: The most recent soundboard play for this overlay, or null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverlaySafeSoundboardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/soundboard/catalogue:
    get:
      tags: [Soundboard]
      operationId: getChannelSoundboardCatalogue
      security: [{ bearerAuth: [] }]
      description: >-
        The full first-party soundboard catalogue with this channel's enable/disable state.
        Available at every tier (12.6): storing, viewing and managing a durable creator
        record is never tier-gated - the 30.3 Pro+ entitlement governs only whether the
        Master Canvas renders the card, and lives in the overlay read alone.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Every catalogue entry, resolved against this channel's disables.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoundboardCatalogueListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/soundboard/catalogue/{entryId}:
    put:
      tags: [Soundboard]
      operationId: setChannelSoundboardCatalogueEntryEnabled
      security: [{ bearerAuth: [] }]
      description: >-
        Enables or disables one catalogue entry for this channel. Owner/admin only, and not
        tier-gated. A single insert/delete, live on the very next read - no cache, no
        propagation step.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/SoundboardEntryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToggleSoundboardCatalogueEntryRequest' }
      responses:
        '200':
          description: The full catalogue after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoundboardCatalogueListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/soundboard/uploads:
    get:
      tags: [Soundboard]
      operationId: getChannelSoundboardUploads
      security: [{ bearerAuth: [] }]
      description: This channel's own uploaded clips. Available at every tier (12.6).
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: This channel's uploaded clips.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoundboardUploadListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
    post:
      tags: [Soundboard]
      operationId: uploadChannelSoundboardClip
      security: [{ bearerAuth: [] }]
      description: >-
        Uploads a creator's own clip. Owner/admin only. NO REVIEW STEP: a successful 201
        means the clip is immediately triggerable - there is no status, moderationState,
        approved or reviewedAt field anywhere in this API for a clip to be pending in.

        Duration and file-size caps are read from server configuration, never from this
        request, and are CONFIGURED BUT UNSET in every environment today - the mechanism
        exists and reads its value from config, and with no value set, every upload is
        refused with soundboard_uploads_not_configured regardless of the clip. Unset never
        means unlimited.

        rightsAttested is a positive rights attestation (18.2, AUD-06), recorded with a
        timestamp; a missing or false attestation is refused before any cap is even checked.
        additionalProperties is false deliberately: a body carrying a status, moderation or
        review field, or a client-supplied cap, is rejected before the store is reached.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadSoundboardClipRequest' }
      responses:
        '201':
          description: The uploaded clip.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoundboardUploadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/soundboard/play:
    post:
      tags: [Soundboard]
      operationId: triggerChannelSoundboardPlay
      security: [{ bearerAuth: [] }]
      description: >-
        The creator triggers playback of one of their own available clips - a first-party
        catalogue entry (tier-eligible and not disabled) or one of their own uploads. Owner/
        admin only. Exactly one of catalogueEntryId / uploadId is required; a body carrying
        both, neither, or a supporter/viewer field is rejected before the store is reached.
        No cooldown is applied - none is decided anywhere in this repository. There is no
        supporter-triggered path in this slice (AUD-03 stays open); every trigger here is
        the creator's own.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerSoundboardPlayRequest' }
      responses:
        '201':
          description: The triggered play's id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerSoundboardPlayResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/sponsor-card:
    get:
      tags: [Configuration]
      operationId: getChannelSponsorCard
      security: [{ bearerAuth: [] }]
      description: >-
        The channel's one sponsor card, or null. Available at every tier: storing, viewing and
        exporting a durable creator record is never tier-gated (12.6). sponsor_card is already
        one of migration 0131's twenty Master Canvas catalogue keys, and the 30.3 module-count
        cap it enforces is the only thing that decides whether the CANVAS renders the card.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: The channel's sponsor card, or null when none has been configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelSponsorCardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
    put:
      tags: [Configuration]
      operationId: upsertChannelSponsorCard
      security: [{ bearerAuth: [] }]
      description: >-
        Sets the channel's one sponsor card - the sponsor name, the show/hide toggle, an
        optional scheduled placement window, and optional logo metadata. Owner/admin only, and
        not tier-gated. There is no separate create/update verb: PUT always writes the
        channel's single row, and calling it twice upserts the same card rather than creating a
        second one. Disabling the card is enabled: false on the same call, not a separate
        delete.

        The body carries no field capable of counting, timing or accumulating anything about
        the card being displayed, and no field capable of carrying a remote URL, script,
        iframe or stylesheet onto the Master Canvas (9.1.1) - additionalProperties is false so
        a client cannot even attempt to write one.
      parameters:

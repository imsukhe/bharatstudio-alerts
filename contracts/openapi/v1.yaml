        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/tournament/{tournamentId}:
    patch:
      tags: [Tournament]
      operationId: setChannelTournamentProgress
      security: [{ bearerAuth: [] }]
      description: >-
        Reports which round the bracket is in and how many of that round's matches are
        complete. Owner/admin only, and not tier-gated. Both values are required together,
        because they are read together on one card: a partial write would paint a round from
        one moment beside a match count from another. The exact bounds come from the
        REFERENCED LOBBY - the round ceiling is log2(seatCount) and the match ceiling is
        seatCount >> round - so a value outside them is a 400. No score, pairing, result,
        winner or dispute note is accepted: those are TRN-04 and need match rows, which do not
        exist in this slice. An unknown, already-concluded, other-channel or unauthorised
        tournament is one indistinguishable 404.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/TournamentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTournamentProgressRequest' }
      responses:
        '200':
          description: The updated tournament.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelTournamentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/tournament/{tournamentId}/conclude:
    post:
      tags: [Tournament]
      operationId: concludeChannelTournament
      security: [{ bearerAuth: [] }]
      description: >-
        Concludes the named tournament. Owner/admin only, and not tier-gated. Concluding
        deletes nothing - the record stays durable and readable (12.6) - and ANNOUNCES
        nothing: the overlay simply stops having anything to paint. There is deliberately no
        terminal state, because a terminal label on a bracket is a winner announcement with
        the name left out, and a winner announcement requires consent (17.1) that no mechanism
        in this schema provides. An unknown, already-concluded, other-channel or unauthorised
        tournament is one indistinguishable 404.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/TournamentId'
      responses:
        '204':
          description: The tournament was concluded. No result is produced.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/sponsor-card:
    get:
      tags: [Configuration]
      operationId: getChannelSponsorCard
      security: [{ bearerAuth: [] }]
      description: >-
        The channel's one sponsor card, or null. Available at every tier: storing, viewing and
        exporting a durable creator record is never tier-gated (12.6). sponsor_card is already

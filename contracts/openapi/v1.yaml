        commandId: { type: string, format: uuid }
        status: { type: string, enum: [accepted, rejected] }
        acceptedAt: { type: string, format: date-time }
        eventId: { type: string, format: uuid, description: Present for send_test_alert commands and identifies the durable synthetic alert event. }
    CompanionControlSessionRequest:
      type: object
      additionalProperties: false
      required: [clientType, clientInstanceId]
      properties:
        clientType: { type: string, enum: [web, mobile, desktop] }
        clientInstanceId: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    CompanionControlSession:
      type: object
      additionalProperties: false
      required: [schemaVersion, sessionId, channelId, clientType, clientInstanceId, leaseUntil, createdAt, reused]
      properties:
        schemaVersion: { type: string, const: v1 }
        sessionId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        clientType: { type: string, enum: [web, mobile, desktop] }
        clientInstanceId: { type: string, minLength: 16, maxLength: 128 }
        leaseUntil: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        reused: { type: boolean }
    ChannelMembership:
      type: object
      additionalProperties: false
      required: [channelId, role]
      properties:
        channelId: { type: string, format: uuid }
        role: { type: string, enum: [owner, admin, operator, moderator, viewer] }
    EntitlementResult:
      type: object
      additionalProperties: false
      required: [schemaVersion, channelId, tier, source, entitlementVersion, values]
      properties:
        schemaVersion: { type: string, const: v1 }
        channelId: { type: string, format: uuid }
        tier: { type: string, enum: [free, pro, creator, studio] }
        source: { type: string, enum: [individual_plan] }
        entitlementVersion: { type: integer, minimum: 1 }
        values: { type: object, additionalProperties: true }
    ActivationState:
      type: object
      additionalProperties: false
      required: [schemaVersion, payoutConnected, payoutConnectedAt, overlayConnected, overlayConnectedAt, firstAlertFired, firstAlertFiredAt]
      properties:
        schemaVersion: { type: string, const: v1 }
        payoutConnected: { type: boolean }
        payoutConnectedAt: { type: [string, 'null'], format: date-time }
        overlayConnected: { type: boolean }
        overlayConnectedAt: { type: [string, 'null'], format: date-time }
        firstAlertFired: { type: boolean }
        firstAlertFiredAt: { type: [string, 'null'], format: date-time }
    RevenueKpis:
      type: object
      additionalProperties: false
      required: [schemaVersion, windowStart, windowEnd, averageNetTipPaise, netTipCount, totalNetTipPaise, supporterCount, repeatSupporterCount, repeatSupporterRate, challengeRevenuePaise, voteRevenuePaise]
      properties:
        schemaVersion: { type: string, const: v1 }
        windowStart: { type: [string, 'null'], format: date-time }
        windowEnd: { type: [string, 'null'], format: date-time }
        averageNetTipPaise: { type: string, description: Decimal string (paise). }
        netTipCount: { type: string, description: Integer string. }
        totalNetTipPaise: { type: string, description: Integer string (paise). }
        supporterCount: { type: string, description: Integer string. }
        repeatSupporterCount: { type: string, description: Integer string. }
        repeatSupporterRate: { type: string, description: Decimal string, 0-1. }
        challengeRevenuePaise: { type: string, description: Integer string (paise). }
        voteRevenuePaise: { type: string, description: Integer string (paise). }
    OverlaySession:
      type: object
      additionalProperties: false
      required: [schemaVersion, overlayId, expiresAt, streamUrl]
      properties:
        schemaVersion: { type: string, const: v1 }
        overlayId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        streamUrl:
          type: string
          format: uri
          description: >-
            Web overlay HTML URL for an OBS Browser Source. The short-lived
            credential must be carried only in the URL fragment; this URL must
            contain no query credential and the API SSE endpoint must be
            reached by the page with an Authorization bearer header.
    OverlaySseEvent:
      type: object
      additionalProperties: false
      required: [schemaVersion, cursor, eventId, eventType, traceId, createdAt, payload]
      properties:
        schemaVersion: { type: string, const: v1 }
        cursor: { type: string, minLength: 1, maxLength: 256 }
        eventId: { type: string, format: uuid }
        eventType: { type: string, enum: [alert.ready, alert.update, alert.hold, alert.complete, resync.required] }
        traceId: { type: string, minLength: 1, maxLength: 128 }
        createdAt: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    OverlayCursorAcknowledgement:
      type: object
      additionalProperties: false
      required: [cursor, eventId]
      properties:
        cursor: { type: string, minLength: 1, maxLength: 256 }
        eventId: { type: string, format: uuid }
    InternalJobRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 16, maxLength: 160 }
        window: { type: string, minLength: 1, maxLength: 80 }
    MaintenanceResult:
      type: object
      additionalProperties: false
      required: [schemaVersion, job, status, runId]
      properties:
        schemaVersion: { type: string, const: v1 }
        job: { type: string, enum: [overlay-sessions] }
        status: { type: string, enum: [accepted, completed, already_completed] }
        runId: { type: string, format: uuid }

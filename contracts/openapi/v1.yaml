components:
  parameters:
    Handle:
      name: handle
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReceiptToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 8, maxLength: 32 }
    TipIntentToken:
      name: token
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9A-Za-z]{10}$' }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OverlayId:
      name: overlayId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InteractionDefinitionId:
      name: definitionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueueId:
      name: queueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AlertId:
      name: alertId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      schema: { type: integer, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 256 }
      description: Opaque history cursor. Current form is ISO-8601 timestamp followed by "|" and the event UUID; timestamp-only legacy cursors remain readable during migration.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    viewerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-viewer-session-token
    overlayToken:
      type: http
      scheme: bearer

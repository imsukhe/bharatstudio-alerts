        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertSponsorCardRequest' }
      responses:
        '200':
          description: The saved sponsor card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelSponsorCardResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/overlay-widgets/{overlayId}/qr-smart-card:
    get:
      tags: [Overlay]
      operationId: getOverlayQrSmartCard
      summary: The channel's enabled QR smart card destination and label, or null.
      description: >-
        Master Canvas module #10 (QR Smart Card). Owner decision, 2026-09-17: "The creator
        sets one destination and one label. The card shows or hides on a single toggle. That
        is the entire feature." No scene profile, no CMP-17 (Clutch Mode) dependency, no
        destination allow-list, no link shortening, and no scan, view, impression or exposure
        counter of any kind - not authorised, and not present in the schema behind this read.

        Aggregate-free by construction: the returned column set is two strings, destination
        and label. No card id, no timestamp and - pointedly - no enabled flag: the function's
        own `where is_enabled` predicate means a row is returned ONLY when the card is on, so
        the row's presence already carries the toggle's true state. A disabled card and a
        channel that has never configured one answer with the identical null, exactly like an
        unrecognised, expired, revoked or foreign token.

        The destination is DATA, never a fetch target (9.1.1): it is rendered client-side as a
        first-party-generated QR code image, never a link the Master Canvas runtime fetches,
        navigates to or embeds.

        Bounded to the channel's current card and never a history (12.7). Not tier-gated:
        qr_smart_card is one of 0131's own twenty catalogue module keys, and the 30.3 render
        cap is the only gate that applies.
      security: [{ overlayToken: [] }]
      parameters:
        - $ref: '#/components/parameters/OverlayId'
      responses:
        '200':
          description: Token-scoped QR smart card destination and label for this overlay, or null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverlayQrSmartCardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/qr-smart-card:
    get:
      tags: [QR smart card]
      operationId: getChannelQrSmartCard
      security: [{ bearerAuth: [] }]
      description: >-
        The channel's current QR smart card, or null when none has been configured. Available
        at every tier: storing, viewing and exporting a durable creator record is never
        tier-gated (12.6). The 30.3 Master Canvas module cap governs only whether the Canvas
        renders the card.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: The channel's current QR smart card, or null when none is configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelQrSmartCardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
    put:
      tags: [QR smart card]
      operationId: setChannelQrSmartCard
      summary: Set the destination and label. Creates the card on first call, updates it after.
      description: >-
        Owner/admin only. Upsert semantics: creates the card (with the toggle defaulted off)
        on the first call, and updates destination/label on every later call without touching
        the toggle - two independent writes for two independent creator decisions. The body
        carries destination and label and nothing else: a request carrying an allow-list, a
        short-link flag, a scan count or a scene id is rejected with 400, because this module
        holds no such concept. Both fields are bounded 1-120 characters, reusing the
        already-decided challenge-title bound (migration 0109 line 67) rather than a fresh
        number chosen for a URL.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertQrSmartCardRequest' }
      responses:
        '200':
          description: The card after the write.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelQrSmartCardResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/qr-smart-card/enabled:
    put:
      tags: [QR smart card]
      operationId: setChannelQrSmartCardEnabled
      summary: The single toggle - show or hide the card on the Master Canvas.
      description: >-
        Owner/admin only. Idempotent: the body carries the value rather than requesting a
        toggle, the same shape /v1/channels/{channelId}/safe-mode already uses. Never creates
        a card - a channel that has never set a destination/label has nothing to toggle, and
        this returns 404 rather than implicitly creating an empty enabled card.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetQrSmartCardEnabledRequest' }
      responses:
        '200':
          description: The card after the toggle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelQrSmartCardResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/canvas-layout:
    get:
      tags: [Canvas layout]
      operationId: getChannelCanvasLayout
      security: [{ bearerAuth: [] }]
      description: >-
        Master Canvas §6 module #14 (Vertical Stream Layout, migration 0147). A LAYOUT IS NOT
        A MODULE: this setting consumes no 30.3 cap slot and is not one of the sixteen
        master-canvas module keys. Configuring the layout is never tier-gated (12.6) -
        storing/viewing is available at every tier - but verticalEntitled reports whether the
        Pro+ render gate (30.3) currently applies, so the creator UI can show "Pro required"
        without a second, independently-wrong copy of the gate. That gate itself lives solely
        inside the overlay read below.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: The channel's configured layout and whether vertical currently renders, or null when never configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelCanvasLayoutResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
    put:
      tags: [Canvas layout]
      operationId: setChannelCanvasLayout
      summary: Set the canvas layout - horizontal (default) or vertical.
      description: >-
        Owner/admin only. One fixed 9:16 arrangement, no variant selection and no variant
        system (that is CST-08, Phase 2) - the body accepts exactly horizontal or vertical and
        nothing else. Never tier-gated to STORE (12.6); whether the overlay actually RENDERS
        vertical is decided solely by the overlay read, never by this write.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCanvasLayoutRequest' }
      responses:
        '200':
          description: The layout after the write.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelCanvasLayoutResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/capabilities:
    get:
      tags: [Capabilities]
      operationId: getChannelCapabilities
      security: [{ bearerAuth: [] }]
      description: >-
        CTL phase 1 (migration 0149): the capability control plane's only phase-1 route. Reads
        the CTL-03 resolved capability blob for the WHOLE channel in one call - never one
        request per capability flag. app_private.get_channel_capabilities resolves every
        registered capability's kill -> denylist -> rollout -> tier -> override precedence
        (CTL-02) server-side and returns a single object mapping capability key to boolean,
        cached and versioned by `generation` (CTL-03). This is a read-only creator/dashboard
        surface: there is no write route here in phase 1 - CTL-04's future admin UI (a
        different repository) is what will call the staff write path this migration ships at
        the database layer. The registry structurally cannot contain a capability gating a
        durable creator record (CTL-14, 12.6) and carries no per-tier retention field (CTL-15,
        12.6.2) - both are schema-level properties of migration 0149, not something this
        response can violate.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: The channel's resolved capability blob.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelCapabilitiesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/admin/capability-registry/changes:
    post:
      tags: [CapabilityChangeManagement]
      operationId: proposeCapabilityChange
      security: [{ bearerAuth: [] }]
      description: >-
        CTL-06/07/09 (migration 0152), platform staff only. Proposes a governed change to a
        capability_registry row (CTL-01, migration 0149) - a brand-new capability or a change to
        an existing one. `effectiveAt` omitted defaults to now (an unstaged change); a future
        timestamp stages it (CTL-06) - a staged change is applied automatically the moment it is
        both approved and due, on the next read through this plane, never by a separate
        trigger call. `capacityClass` accepts only the same closed whitelist as the registry
        itself (CTL-09/CTL-14): a value naming a durable-creator-record concept (payment,
        receipt, refund, audit trail, etc.) is rejected with 400 before any row is written -
        this panel cannot represent a correctness dimension, not merely refuse one by
        convention. Moving an EXISTING capability from a paid min_tier (pro/creator/studio) to
        null/free requires an additional owner sign-off approval (CTL-07 rule 2) before this
        change can complete - see `requiresOwnerSignoff` on the response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposeCapabilityChangeRequest' }
      responses:
        '201':
          description: The created (and, if immediately due, already-applied) change request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityChangeRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
    get:
      tags: [CapabilityChangeManagement]
      operationId: listCapabilityChanges
      security: [{ bearerAuth: [] }]
      description: >-
        CTL-06, platform staff only. Every due-and-approved change is applied (CTL-06's
        read-time correctness) before this list is built, so a listing is never stale even if
        nothing ever swept it separately.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending_approval, approved, applied, rejected] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Change requests, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityChangeListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/admin/capability-registry/changes/{changeRequestId}:
    get:
      tags: [CapabilityChangeManagement]
      operationId: getCapabilityChange
      security: [{ bearerAuth: [] }]
      description: >-
        CTL-06/07/08, platform staff only. Reading this change applies it first if it is
        approved and its effectiveAt has already passed (CTL-06) - the returned `status` already
        reflects that. `approvals` lists every recorded approval (CTL-07), including which were
        `staff` and which was `owner`.
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
      responses:
        '200':
          description: The change request and its recorded approvals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityChangeDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/admin/capability-registry/changes/{changeRequestId}/approve:
    post:
      tags: [CapabilityChangeManagement]
      operationId: approveCapabilityChange
      security: [{ bearerAuth: [] }]
      description: >-
        CTL-07 rule 1 (two-staff, maker-checker) and rule 2 (owner sign-off). Records one
        approval of the given kind from the caller. The proposer of a change may never approve
        their own change (403). `approvalKind: owner` is rejected (400) when the change does not
        require owner sign-off (`requiresOwnerSignoff: false`). Status becomes `approved` only
        once two DISTINCT `staff` approvals exist, plus one `owner` approval when required - and
        immediately becomes `applied` in the same response if the change's effectiveAt has
        already passed (CTL-06).
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveCapabilityChangeRequest' }
      responses:
        '200':
          description: The change request after recording this approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityChangeRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/admin/capability-registry/changes/{changeRequestId}/reject:
    post:
      tags: [CapabilityChangeManagement]
      operationId: rejectCapabilityChange
      security: [{ bearerAuth: [] }]
      description: >-
        Rejects a change still pending approval; a reason is required. A change that already
        left pending_approval (approved, applied, or already rejected) cannot be rejected (409).
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectCapabilityChangeRequest' }
      responses:
        '200':
          description: The rejected change request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityChangeRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/admin/capability-registry/{capabilityKey}/kill:
    post:
      tags: [CapabilityChangeManagement]
      operationId: killCapability
      security: [{ bearerAuth: [] }]
      description: >-
        CTL-07 rule 3: single-admin global_kill. ONE platform admin, no approval round -
        applied to the capability's kill_switch immediately, in this same call, for incident
        response. "global_kill" here reaches the existing per-capability kill_switch
        (capability_registry.kill_switch, migration 0149) through a fast single-admin path;
        there is no separate all-capabilities-at-once master switch. Recorded in the same
        change-request ledger as every governed change for one unified audit trail, but this
        action never enters the pending_approval/staff-approval machinery.
      parameters:
        - $ref: '#/components/parameters/CapabilityKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KillCapabilityRequest' }
      responses:
        '200':
          description: The kill change request, already applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityChangeRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/admin/capability-registry/{capabilityKey}/revert:
    post:
      tags: [CapabilityChangeManagement]
      operationId: revertCapability
      security: [{ bearerAuth: [] }]
      description: >-
        CTL-08: one-action revert to the capability's immediately-previous version, restored
        from its own capability_registry_audit trail (migration 0149) and applied immediately by
        ONE platform admin - no approval round. This is always a NEW forward version (never a
        mutation or deletion of any existing audit row): reverting version 3 back to version 2's
        values produces version 4, whose values happen to match version 2's. A capability with
        only ever one version (nothing to revert to), or that does not exist, is a 404.
      parameters:
        - $ref: '#/components/parameters/CapabilityKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevertCapabilityRequest' }
      responses:
        '200':
          description: The revert change request, already applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityChangeRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/safety/corpus-terms:
    get:
      tags: [Moderation]
      operationId: listSafetyCorpusTerms
      security: [{ bearerAuth: [] }]
      description: >-
        SAF phase 1 (migration 0151, the moderation pipeline spine). Global terms plus this
        channel's own, in ONE read - SAF-05's "global plus per-creator" as one call, never two a
        caller has to remember to make. app_private.get_safety_corpus_terms is the ONLY reachable
        read path (bsa_app has no SELECT grant on safety_corpus_terms itself, revoked from both
        public and bsa_app - SAF-01's structural "one pipeline" guard). This is corpus
        MANAGEMENT only - it does not run any text through the pipeline
        (apps/api/src/domain/safety-pipeline.ts), which is not wired into any live surface yet.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Every corpus term visible to this channel (global plus its own).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafetyCorpusTermListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
    post:
      tags: [Moderation]
      operationId: createSafetyCorpusTerm
      security: [{ bearerAuth: [] }]
      description: >-
        Adds one term to THIS channel's own corpus. Owner/admin only
        (app_private.create_safety_corpus_term, migration 0151). There is no way to create a
        GLOBAL term (channel_id null) through this route - that stays a staff-only, data-layer
        primitive with no HTTP surface in this phase, the same CTL-04 admin-UI deferral migration
        0149 already established. `displayDecision`/`ttsDecision`/`moderatorReviewDecision` are
        the SAF-09 per-surface decisions this term forces when matched - `payment` and
        `storedRecord` are never configurable per term; both are structural constants enforced at
        the database layer (see the evidence table's own CHECK constraints).
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSafetyCorpusTermRequest' }
      responses:
        '201':
          description: The created term.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafetyCorpusTerm' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/safety/corpus-terms/{termId}:
    delete:
      tags: [Moderation]
      operationId: deleteSafetyCorpusTerm
      security: [{ bearerAuth: [] }]
      description: >-
        Removes one of THIS channel's own corpus terms. Owner/admin only. A global term, or a
        term belonging to a different channel, is never removable through this route -
        app_private.delete_safety_corpus_term (migration 0151) returns the identical "not found"
        either way, so this endpoint cannot be used to enumerate another channel's corpus.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/SafetyCorpusTermId'
      responses:
        '204':
          description: The term was removed.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/overlay-widgets/{overlayId}/canvas-layout:
    get:
      tags: [Overlay]
      operationId: getOverlayCanvasLayout
      summary: The effective canvas layout for this overlay - always answered for a valid session.
      description: >-
        Master Canvas §6 module #14 (Vertical Stream Layout). Unlike every other overlay
        widget read, a valid session ALWAYS returns exactly one layout: the 30.3 Pro+ render
        gate (app_private.vertical_canvas_layout_entitled) is evaluated INSIDE
        app_private.list_overlay_canvas_layout (migration 0147), so a sub-Pro channel that
        configured vertical still receives layout=horizontal - never an error, and never null
        for that reason. `canvasLayout: null` here means the SESSION itself is invalid
        (revoked/expired/wrong fingerprint/foreign), the one state this response still
        represents. 12.7: this read adds no fetch, subscription or retained state to any other
        module - it is the one value that decides how already-fetched modules (compact goal,
        QR Smart Card, Reaction Cloud - never chat, per the 2026-09-17 #19 decision) are
        arranged.
      security: [{ overlayToken: [] }]
      parameters:
        - $ref: '#/components/parameters/OverlayId'
      responses:
        '200':
          description: Token-scoped effective canvas layout for this overlay, or null only for an invalid session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverlayCanvasLayoutResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/overlay-lottie/{overlayId}:
    get:
      tags: [Overlay]
      operationId: listOverlayLottieAssets

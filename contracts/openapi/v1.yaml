          description: The updated lobby session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelLobbySessionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/lobby-session/{lobbyId}/close:
    post:
      tags: [Lobby]
      operationId: closeChannelLobbySession
      security: [{ bearerAuth: [] }]
      description: >-
        Closes the named lobby session. Owner/admin only, and not tier-gated. Closing deletes
        nothing - the record stays durable and readable (12.6); 16.1 step 8's automatic
        deletion of temporary lobby data concerns the Lobby Engine's codes, tokens and

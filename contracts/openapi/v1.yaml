            application/json:
              schema: { $ref: '#/components/schemas/ChannelLobbySessionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
  /v1/channels/{channelId}/lobby-session/{lobbyId}:
    patch:
      tags: [Lobby]
      operationId: updateChannelLobbySessionCounts
      security: [{ bearerAuth: [] }]
      description: >-
        Reports how many seats are confirmed and how long the queue is. Owner/admin only, and
        not tier-gated. The lobby id is required so the write is addressed rather than ambient
        - a stale dashboard tab cannot write counts onto a lobby opened after that tab loaded.
        Both counts are required together, because they are read together on one card: a
        partial write would paint a seat figure from one moment beside a queue figure from
        another. Confirming more seats than the lobby has is a 400; the database refuses it
        outright. An unknown, already-closed, other-channel or unauthorised lobby is one
        indistinguishable 404.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/LobbySessionId'

      description: Opaque history cursor. Current form is ISO-8601 timestamp followed by "|" and the event UUID; timestamp-only legacy cursors remain readable during migration.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    viewerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-viewer-session-token
    overlayToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-overlay-token
    serviceIdentity:
      type: http
      scheme: bearer
      bearerFormat: OIDC-service-identity-token
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated identity lacks permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Retryable rate limit.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RetryableFailure:
      description: Temporary service failure; the client may retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Request conflicts with current resource/version state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: bharatstudio-alerts-api }
    ReadinessReadyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ready }
    ReadinessUnavailableResponse:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { type: string, const: not_ready }
        reason: { type: string, enum: [runtime_adapters_not_configured, runtime_dependency_unavailable] }
    GoalCompletion:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - goalId
        - completed
        - completedAt
        - completedProgressPaise
        - targetAmountPaiseAtCompletion
        - progressPaise
        - targetAmountPaise
        - lastReopenedAt
        - lastReopenedByUserId
        - lastReopenReason
      properties:
        schemaVersion: { type: string, const: v1 }
        goalId: { type: string, format: uuid }
        completed: { type: boolean }
        completedAt: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        completedProgressPaise: { oneOf: [{ type: 'null' }, { type: integer, minimum: 0 }] }
        targetAmountPaiseAtCompletion: { oneOf: [{ type: 'null' }, { type: integer, minimum: 1000 }] }
        progressPaise: { type: integer, minimum: 0 }
        targetAmountPaise: { type: integer, minimum: 1000 }
        lastReopenedAt: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        lastReopenedByUserId: { oneOf: [{ type: 'null' }, { type: string, format: uuid }] }
        lastReopenReason: { oneOf: [{ type: 'null' }, { type: string, minLength: 1, maxLength: 500 }] }
    ReopenGoalCompletionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    OverlayGoal:
      type: object
      additionalProperties: false
      required: [schemaVersion, goalId, title, targetAmountPaise, window, progressPaise, reached]
      properties:
        schemaVersion: { type: string, const: v1 }
        goalId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        targetAmountPaise: { type: integer, minimum: 0 }
        window: { type: string, enum: [stream, daily, monthly, open] }
        progressPaise: { type: integer, minimum: 0 }
        reached: { type: boolean }
    OverlayGoalResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, goal]
      properties:
        schemaVersion: { type: string, const: v1 }
        goal:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OverlayGoal'
    OverlayChallenge:
      type: object
      additionalProperties: false
      required: [schemaVersion, challengeId, title, kind, targetAmountPaise, state, progressPaise, targetReached]
      properties:
        schemaVersion: { type: string, const: v1 }
        challengeId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [stake, bounty] }
        targetAmountPaise: { type: integer, minimum: 0 }
        state: { type: string, enum: [draft, active, succeeded, failed, cancelled] }
        progressPaise: { type: integer, minimum: 0 }
        targetReached: { type: boolean }
    OverlayChallengeResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, challenge]
      properties:
        schemaVersion: { type: string, const: v1 }
        challenge:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OverlayChallenge'
    OverlayModeratorStatus:
      type: object
      additionalProperties: false
      required: [schemaVersion, heldCount, safeMode]
      properties:
        schemaVersion: { type: string, const: v1 }
        heldCount:
          type: integer
          minimum: 0
          description: >-
            Alert deliveries held for a moderator's decision on this channel. Held deliveries, not
            chat messages. Zero is a valid answer and means nothing is held.
        safeMode:
          type: boolean
          description: >-
            Whether the creator's safe-mode switch is on for this channel. While it is on, incoming
            alerts route to held rather than ready. Never automatic and never engaged by any signal,
            and NOT the queue-paused flag, which is a separate queue lifecycle state this projection
            does not carry. True with heldCount 0 is a real state - the creator has just switched it
            on and nothing has arrived yet.
    ChannelSafeMode:
      type: object
      additionalProperties: false
      required: [schemaVersion, enabled]
      description: >-
        The creator-facing safe-mode state. One boolean, deliberately: safe mode is a switch, not a
        policy object, so there is no threshold, window, rate, duration, expiry, reason or trigger
        field, and none may be added without a fresh owner decision.
      properties:
        schemaVersion: { type: string, const: v1 }
        enabled: { type: boolean }
    ChannelSafeModeResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, safeMode]
      properties:
        schemaVersion: { type: string, const: v1 }
        safeMode: { $ref: '#/components/schemas/ChannelSafeMode' }
    ChannelSafeModeRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      description: >-
        The value to set, not a toggle request. additionalProperties false is load-bearing: a body
        carrying threshold, windowSeconds, auto, triggeredBy, expiresAt, durationSeconds or reason
        is a 400, because safe mode is never automatic. enabled declares its two allowed VALUES
        rather than a type, so nothing is coerced into a switch position - null, "true" and 1 are
        all 400. That is stricter than this API's other boolean fields, deliberately: enabled null
        was measured to coerce to false under the shared validator configuration, which would have
        silently turned safe mode off and released a channel's held alert flow.
      properties:
        enabled: { enum: [true, false] }
    QrSmartCard:
      type: object
      additionalProperties: false
      required: [schemaVersion, destination, label, isEnabled, createdAt, updatedAt]
      description: >-
        Creator-facing QR smart card. One destination, one label, one toggle - owner decision,
        2026-09-17: "That is the entire feature." No scene profile, no allow-list, no
        short-link, no scan/view/impression/exposure counter field exists on this type, and
        none may be added without a fresh owner decision overturning this one.
      properties:
        schemaVersion: { type: string, const: v1 }
        destination:
          type: string
          minLength: 1
          maxLength: 120
          description: >-
            Rendered client-side as a first-party QR code image. Data, never a link the Master
            Canvas runtime fetches, navigates to or embeds (9.1.1).
        label: { type: string, minLength: 1, maxLength: 120 }
        isEnabled:
          type: boolean
          description: The single toggle. Whether the card shows on the Master Canvas.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChannelQrSmartCardResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, card]
      properties:
        schemaVersion: { type: string, const: v1 }
        card:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/QrSmartCard'
    UpsertQrSmartCardRequest:
      type: object
      additionalProperties: false
      required: [destination, label]
      description: >-
        The destination and label, and nothing else. additionalProperties false is
        load-bearing: a body carrying an allow-list, a short-link flag, a scan count or a
        scene id is rejected with 400 before the store is ever called - this module holds no
        such concept. Both bounds are migration 0109 line 67's already-decided
        challenge-title bound, reused rather than a fresh number chosen for a URL. Never
        touches the toggle; use the /enabled endpoint for that.
      properties:
        destination: { type: string, minLength: 1, maxLength: 120 }
        label: { type: string, minLength: 1, maxLength: 120 }
    SetQrSmartCardEnabledRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      description: The single toggle's value, not a toggle request - the same shape ChannelSafeModeRequest uses.
      properties:
        enabled: { enum: [true, false] }
    OverlayQrSmartCard:
      type: object
      additionalProperties: false
      required: [schemaVersion, destination, label]
      description: >-
        Overlay projection: two fields, 12.7-bounded. No card id, no timestamp and no enabled
        flag - the row's presence already carries the toggle's true state, because the read it
        comes from returns a row only when the card is on.
      properties:
        schemaVersion: { type: string, const: v1 }
        destination: { type: string, minLength: 1, maxLength: 120 }
        label: { type: string, minLength: 1, maxLength: 120 }
    OverlayQrSmartCardResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, qrSmartCard]
      properties:
        schemaVersion: { type: string, const: v1 }
        qrSmartCard:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OverlayQrSmartCard'
    ChannelCanvasLayout:
      type: object
      additionalProperties: false
      required: [schemaVersion, layout, verticalEntitled]
      description: >-
        Creator-facing projection: §6 module #14 (Vertical Stream Layout). A LAYOUT IS NOT A
        MODULE - consumes no 30.3 cap slot, not one of the sixteen master-canvas module keys.
        No variant id, no aspect ratio field and no scene concept exists on this type (this
        task's own scope: one fixed 9:16 arrangement, no variant system - that is CST-08,
        Phase 2).
      properties:
        schemaVersion: { type: string, const: v1 }
        layout: { enum: [horizontal, vertical] }
        verticalEntitled:
          type: boolean
          description: Whether the 30.3 Pro+ gate currently allows vertical to render. Reporting only - the gate itself lives solely inside the overlay read.
    ChannelCanvasLayoutResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, canvasLayout]
      properties:
        schemaVersion: { type: string, const: v1 }
        canvasLayout:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ChannelCanvasLayout'
    SetCanvasLayoutRequest:
      type: object
      additionalProperties: false
      required: [layout]
      description: >-
        The layout value, and nothing else. additionalProperties false is load-bearing: a body
        carrying a variant id, an aspect ratio or a scene id is rejected with 400 before the
        store is ever called - this setting holds no such concept.
      properties:
        layout: { enum: [horizontal, vertical] }
    ChannelCapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, generation, resolvedAt, capabilities]
      description: >-
        CTL-03's resolved capability blob (migration 0149): every registered capability's
        resolved boolean for this channel, in ONE object - never one field fetched per
        capability. `generation` is the global registry generation this blob was resolved
        against (advances on any registry/denylist/override write); `resolvedAt` is when this
        blob was computed, which may be earlier than the request time on a cache hit
        (app_private.get_channel_capabilities serves a cached row when the generation and the
        channel's current tier both still match what was cached). `capabilities` has no fixed
        key set in this schema - it is a dictionary keyed by whatever capability_key values are
        currently registered, each a plain boolean already resolved through kill -> denylist ->
        rollout -> tier -> override (CTL-02). There is no capability whose key could ever gate a
        durable creator record (CTL-14) and no per-tier retention value can appear here (CTL-15)
        - both are schema-level guarantees of the registry this blob is resolved from.
      properties:
        schemaVersion: { type: string, const: v1 }
        generation: { type: integer, minimum: 1 }
        resolvedAt: { type: string, format: date-time }
        capabilities:
          type: object
          additionalProperties: { type: boolean }
    CapabilityChangeRequest:
      type: object
      additionalProperties: false
      required: [
        schemaVersion, id, capabilityKey, changeKind, status, proposedCapacityClass,
        proposedDescription, proposedKillSwitch, proposedRolloutPercentage, proposedMinTier,
        effectiveAt, requiresOwnerSignoff, staffApprovalCount, ownerApprovalCount, createdBy,
        createdAt, appliedAt, decidedAt, reason
      ]
      description: >-
        CTL-06/07/08/09 (migration 0152). A single proposed-or-applied governance action over
        public.capability_registry (migration 0149). `changeKind: update` goes through the
        CTL-07 approval machinery; `kill` (rule 3) and `revert` (CTL-08) are always immediately
        `status: applied` and carry zero approvals by construction. `effectiveAt` may be in the
        future for a staged `update` (CTL-06) - it is applied automatically, on the next read
        through this plane, the moment it is both `approved` and past `effectiveAt`.
        `requiresOwnerSignoff` is computed once, at propose time, and never changes afterward.
      properties:
        schemaVersion: { type: string, const: v1 }
        id: { type: string, format: uuid }
        capabilityKey: { type: string, pattern: '^[a-z][a-z0-9_]{0,99}$' }
        changeKind: { type: string, enum: [update, kill, revert] }
        status: { type: string, enum: [pending_approval, approved, applied, rejected] }
        proposedCapacityClass:
          type: string
          enum: [active_connector, active_widget, ai_usage, media_upload, custom_asset, team_seat, automation_volume, master_canvas_module]
        proposedDescription: { type: string, minLength: 1, maxLength: 500 }
        proposedKillSwitch: { type: boolean }
        proposedRolloutPercentage: { type: integer, minimum: 0, maximum: 100 }
        proposedMinTier: { oneOf: [{ type: 'null' }, { type: string, enum: [free, pro, creator, studio] }] }
        effectiveAt: { type: string, format: date-time }
        requiresOwnerSignoff: { type: boolean }
        staffApprovalCount: { type: integer, minimum: 0 }
        ownerApprovalCount: { type: integer, minimum: 0 }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        appliedAt: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        decidedAt: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        reason: { oneOf: [{ type: 'null' }, { type: string, maxLength: 500 }] }
    CapabilityChangeApproval:
      type: object
      additionalProperties: false
      required: [id, approvalKind, approverId, approvedAt]
      properties:
        id: { type: string, format: uuid }
        approvalKind: { type: string, enum: [staff, owner] }
        approverId: { type: string, format: uuid }
        approvedAt: { type: string, format: date-time }
    CapabilityChangeDetailResponse:
      description: A CapabilityChangeRequest plus every approval recorded against it (CTL-07 audit visibility).
      allOf:
        - $ref: '#/components/schemas/CapabilityChangeRequest'
        - type: object
          additionalProperties: false
          required: [approvals]
          properties:
            approvals:
              type: array
              items: { $ref: '#/components/schemas/CapabilityChangeApproval' }
    CapabilityChangeListResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, changes]
      properties:
        schemaVersion: { type: string, const: v1 }
        changes:
          type: array
          items: { $ref: '#/components/schemas/CapabilityChangeRequest' }
    ProposeCapabilityChangeRequest:
      type: object
      additionalProperties: false
      required: [capabilityKey, capacityClass, description]
      description: >-
        CTL-09: capacityClass accepts only the closed whitelist - the same nine §12.6.1
        durable-record classes rejected by the registry itself (CTL-14) are unrepresentable
        here too, not merely disallowed by a convention this schema could drift from.
      properties:
        capabilityKey: { type: string, pattern: '^[a-z][a-z0-9_]{0,99}$' }
        capacityClass:
          type: string
          enum: [active_connector, active_widget, ai_usage, media_upload, custom_asset, team_seat, automation_volume, master_canvas_module]
        description: { type: string, minLength: 1, maxLength: 500 }
        killSwitch: { type: boolean, default: false }
        rolloutPercentage: { type: integer, minimum: 0, maximum: 100, default: 100 }
        minTier: { oneOf: [{ type: 'null' }, { type: string, enum: [free, pro, creator, studio] }] }
        effectiveAt:
          type: string
          format: date-time
          description: Omit for an unstaged change effective immediately (CTL-06); a future timestamp stages it.
        reason: { type: string, maxLength: 500 }
    ApproveCapabilityChangeRequest:
      type: object
      additionalProperties: false
      required: [approvalKind]
      properties:
        approvalKind: { type: string, enum: [staff, owner] }
    RejectCapabilityChangeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    KillCapabilityRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }
    RevertCapabilityRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }
    SafetyDecisionValue:
      type: string
      description: >-
        SAF-09's shared decision vocabulary, FULL-PRODUCT-DEFINITION.md S12.2.1's own pipeline
        diagram: "allow, mask, hold, block", per surface.
      enum: [allow, mask, hold, block]
    SafetyCorpusTerm:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - termId
        - scope
        - term
        - wholeWord
        - displayDecision
        - ttsDecision
        - moderatorReviewDecision
        - createdAt
      description: >-
        SAF phase 1 (migration 0151). One row of the compiled corpus. `scope` is `global` (this
        term applies to every channel) or `channel` (this channel's own addition) -
        `app_private.get_safety_corpus_terms` returns both together, SAF-05's "global plus
        per-creator" as one read. `wholeWord` selects whole-word matching (a match only counts at
        a word boundary) versus substring matching - the two are always distinct rows, never a
        setting that applies to the whole corpus. `displayDecision`/`ttsDecision` and
        `moderatorReviewDecision` (`allow` or `hold` - "queued for a human or not",
        FULL-PRODUCT-DEFINITION.md S12.2.4) are what this term forces on those three surfaces
        when it matches - `payment` and the stored-record surface are never configurable per
        term (see SafetyCorpusTermListResponse's own description for why).
      properties:
        schemaVersion: { type: string, const: v1 }
        termId: { type: string, format: uuid }
        scope: { type: string, enum: [global, channel] }
        term: { type: string, minLength: 1, maxLength: 200 }
        wholeWord: { type: boolean }
        displayDecision: { $ref: '#/components/schemas/SafetyDecisionValue' }
        ttsDecision: { $ref: '#/components/schemas/SafetyDecisionValue' }
        moderatorReviewDecision: { type: string, enum: [allow, hold] }
        createdAt: { type: string, format: date-time }
    SafetyCorpusTermListResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, items]
      description: >-
        SAF-01/SAF-05: every corpus term visible to the calling channel - global terms plus this
        channel's own, in the ONE response this ONE read produces. There is no separate global-
        only or channel-only variant of this shape: SAF-01 requires exactly one corpus, so there
        is exactly one list shape. `payment` and the stored-record surface never appear anywhere
        in this response because no corpus term can ever configure them -
        FULL-PRODUCT-DEFINITION.md S12.2.4: "Payment: Never affected by content... Stored record:
        Always stored in full" - both are structural constants enforced where evidence is
        actually recorded (packages/db/migrations/0151's safety_moderation_actions CHECK
        constraints), not a property any corpus term shape could vary.
      properties:
        schemaVersion: { type: string, const: v1 }
        items:
          type: array
          items: { $ref: '#/components/schemas/SafetyCorpusTerm' }
    CreateSafetyCorpusTermRequest:
      type: object
      additionalProperties: false
      required: [term, displayDecision, ttsDecision, moderatorReviewDecision]
      description: >-
        Adds one term to the calling channel's own corpus. `wholeWord` defaults to true when
        omitted. The 200-character bound on `term` is reused verbatim from
        packages/db/migrations/0151's own `check (char_length(btrim(term)) between 1 and 200)`.
      properties:
        term: { type: string, minLength: 1, maxLength: 200 }
        wholeWord: { type: boolean }
        displayDecision: { $ref: '#/components/schemas/SafetyDecisionValue' }
        ttsDecision: { $ref: '#/components/schemas/SafetyDecisionValue' }
        moderatorReviewDecision: { type: string, enum: [allow, hold] }
    OverlayCanvasLayout:
      type: object
      additionalProperties: false
      required: [schemaVersion, layout]
      description: >-
        Overlay projection: one field. No channel id, no timestamp and no entitlement flag -
        those are creator-facing only.
      properties:
        schemaVersion: { type: string, const: v1 }
        layout: { enum: [horizontal, vertical] }
    OverlayCanvasLayoutResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, canvasLayout]
      description: >-
        canvasLayout is null ONLY for an invalid overlay session (revoked/expired/wrong
        fingerprint/foreign) - a valid session always carries a layout, even for a sub-Pro
        channel (it answers horizontal, per the 30.3 gate evaluated server-side inside the
        read).
      properties:
        schemaVersion: { type: string, const: v1 }
        canvasLayout:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OverlayCanvasLayout'
    OverlayModeratorStatusResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, moderatorStatus]
      properties:
        schemaVersion: { type: string, const: v1 }
        moderatorStatus:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OverlayModeratorStatus'
    OverlayReactionCloudEntry:
      type: object
      additionalProperties: false
      required: [entrySource, entryId, displayName, reactionCount]
      description: >-
        One curated-catalogue entry and how many reactions it received inside the read's
        window. A reaction is a send of an entry that already exists in the curated sticker
        catalogue, so there is no asset, url, mime type or render document on this path -
        only the entry's id and its already-public display name. No viewer id, anonymous
        identity, session id, IP address or timestamp appears here; that is enforced by the
        read itself, whose returned column set is exactly these four values.
      properties:
        entrySource:
          type: string
          enum: [catalogue, creator_pack]
          description: >-
            Which half of the EXISTING curated catalogue the entry came from - the first-party
            platform catalogue, or a staff-reviewed creator pack. There is no value here for a
            viewer-supplied asset, because no such path exists.
        entryId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        reactionCount:
          type: integer
          minimum: 1
          description: >-
            Aggregated in the database. An entry with no reactions in the window is absent
            rather than present with a zero.
    OverlayReactionCloudResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, entries]
      description: >-
        Already the server-side sample. The read aggregates every reaction into one row per
        catalogue entry and applies the configured display ceiling inside the database, so a
        client never receives the reaction stream and is never asked to drop part of it
        (19.5), and the response is bounded rather than a history (12.7). An empty array is a
        valid answer, and is also what an unrecognised, expired, revoked or foreign overlay
        token returns - an empty cloud and an unauthorised read both mean paint nothing.
      properties:
        schemaVersion: { type: string, const: v1 }
        entries: { type: array, items: { $ref: '#/components/schemas/OverlayReactionCloudEntry' } }
    PublicReactionSendRequest:
      type: object
      additionalProperties: false
      required: [entrySource, entryId]
      description: >-
        A send of an entry that is already in the channel's live, enabled, tier-eligible
        curated catalogue. additionalProperties is false deliberately: a body carrying a
        viewer id, an asset, a display name or a count is rejected before the store is
        reached. The server re-checks existence, ownership, tier eligibility, the creator's
        live enabled set and staff-review state; a client's claim about any of them is never
        trusted.
      properties:
        entrySource: { type: string, enum: [catalogue, creator_pack] }
        entryId: { type: string, format: uuid }
        turnstileToken:
          oneOf: [{ type: 'null' }, { type: string, maxLength: 2048 }]
          description: >-
            The same bot-verification token the public payment endpoints already take, checked
            by the same guard behind the same configuration flag. Not a viewer identity.
    PublicReactionSendResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, outcome]
      description: >-
        The outcome and nothing else - no reaction id, viewer id, channel id, timestamp or
        remaining-quota figure. A reaction is not a record a viewer owns, reads back, edits or
        deletes, so there is nothing for a viewer to address afterwards.
      properties:
        schemaVersion: { type: string, const: v1 }
        outcome: { type: string, const: recorded }
    OverlayLobbyStatus:
      type: object
      additionalProperties: false
      required: [schemaVersion, seatCount, confirmedSeatCount, queueCount]
      description: >-
        Aggregate status only (16). Three integers, 12.7-bounded to the current lobby. No room
        code, no password, no seat token, no player identifier, no in-game name, no Discord
        name, no viewer id, no anonymous identity and no session id - and no lobby id either,
        which would be a session identifier the card does not paint. Opted-in initials and
        avatars are out of scope: they need an opt-in mechanism that does not exist.
      properties:
        schemaVersion: { type: string, const: v1 }
        seatCount:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: >-
            Total seats. The minimum is arithmetic rather than policy - a lobby with no seats
            cannot render a seat status. There is no product maximum; the upper bound is the
            storage column's own range.
        confirmedSeatCount:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The left half of "8/16 seats confirmed". Never greater than seatCount.
        queueCount:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: >-
            How many people are waiting. A count, never a list - there is no per-viewer row
            behind this figure, so nothing here can correlate one visit to another.
    OverlayLobbyStatusResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, lobbyStatus]
      description: >-
        A null lobbyStatus is a valid answer, and is what an unrecognised, expired, revoked or
        foreign overlay token returns, what a channel with no open lobby returns, and what a
        channel without the Creator+/Events Pack entitlement returns. All four mean paint
        nothing.
      properties:
        schemaVersion: { type: string, const: v1 }
        lobbyStatus:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OverlayLobbyStatus'
    LobbySession:
      type: object
      additionalProperties: false
      required: [schemaVersion, lobbyId, seatCount, confirmedSeatCount, queueCount, openedAt, closedAt, createdAt, updatedAt]
      description: >-
        Creator-facing lobby session. closedAt is a record of when the creator closed the
        lobby (null while it is open), never a scheduled close - there is no duration, timer,
        expiry or deadline field here and none in the schema behind it. It carries no room
        code, password, seat token, participant list or player identifier: those are the Lobby
        Engine and are Phase 3.
      properties:
        schemaVersion: { type: string, const: v1 }
        lobbyId:
          type: string
          format: uuid
          description: >-
            On the creator projection only, because the creator's write path is addressed
            rather than ambient. It is never on the overlay projection.
        seatCount: { type: integer, minimum: 1, maximum: 2147483647 }
        confirmedSeatCount: { type: integer, minimum: 0, maximum: 2147483647 }
        queueCount: { type: integer, minimum: 0, maximum: 2147483647 }
        openedAt: { type: string, format: date-time }
        closedAt: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChannelLobbySessionResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, lobby]
      properties:
        schemaVersion: { type: string, const: v1 }
        lobby:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/LobbySession'
    OpenLobbySessionRequest:
      type: object
      additionalProperties: false
      required: [seatCount]
      description: >-
        The seat count and nothing else. additionalProperties is false deliberately: a body
        carrying a room code, a password, a seat token, a player name, a Discord name, a
        participant list, a ready check, a selection or queue policy, a reserve bench, a
        duration or an expiry is rejected before the store is reached. Every one of those is
        the Lobby Engine (16.1 steps 4-8, 16.2) and none is built by this slice.
      properties:
        seatCount: { type: integer, minimum: 1, maximum: 2147483647 }
    UpdateLobbySessionCountsRequest:
      type: object
      additionalProperties: false
      required: [confirmedSeatCount, queueCount]
      description: >-
        Both counts, together. They are read together on one card, so a partial write would
        paint a seat figure from one moment beside a queue figure from another. The seat count
        is fixed when the lobby is opened and is deliberately not writable here.
      properties:
        confirmedSeatCount: { type: integer, minimum: 0, maximum: 2147483647 }
        queueCount: { type: integer, minimum: 0, maximum: 2147483647 }
    OverlayGiveawayTournament:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - entryCount
        - entryClosesAt
        - tournamentCurrentRound
        - tournamentTotalRounds
        - tournamentCompletedMatchesInRound
        - tournamentMatchesInRound
      description: >-
        Aggregate state only (17). Six values, 12.7-bounded to what is currently live. NO
        winner, result, champion or announcement - 17.1 permits one only WITH CONSENT, no
        consent mechanism exists in this schema, a winner is a participant identifier, and
        nothing could produce one (the mechanic is not built; GIV-07 stays Blocked). NO draw,
        seed, odds, weighting or shuffle. NO prize, escrow, custody, fulfilment, delivery,
        address or claim - BharatStudio never holds, escrows, ships or guarantees a prize and
        the creator is the promoter. NO participant identifier, in-game name, Discord name,
        viewer id, anonymous identity or contact detail, and no giveaway, tournament or lobby
        id either, which would be session identifiers the card does not paint. NO bracket
        tree: a tree needs participant labels, which 16 ruled need an opt-in mechanism that
        does not exist. Either half may be absent; the absent half is null rather than
        fabricated.
      properties:
        schemaVersion: { type: string, const: v1 }
        entryCount:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 0
              maximum: 2147483647
          description: >-
            How many entries the creator has reported. A count, never a list - there is no
            per-entrant row behind this figure, so nothing here can correlate one visit to
            another, and there is no entry path at all, so nothing a payment could gate. Zero
            is meaningful: an open giveaway with nobody entered yet is the invitation.
        entryClosesAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
          description: >-
            The instant the creator's published entry window closes (17.1's entry window, and
            the source of 17.1's "time remaining"). The close INSTANT is returned rather than
            a seconds figure so the countdown ticks on the canvas's existing shared frame loop
            instead of a per-second server read, which 12.7 forbids.
        tournamentCurrentRound:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 1
              maximum: 3
          description: Which round of the single-elimination bracket is in play. The maximum is log2(8), from 30.3.
        tournamentTotalRounds:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 1
              maximum: 3
          description: >-
            How many rounds the bracket has. DERIVED at read time from the referenced lobby
            session's seat count rather than stored - 17.2 builds tournaments ON the Lobby
            Engine rather than beside it, so there is no second copy of the field size to
            drift.
        tournamentCompletedMatchesInRound:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 0
              maximum: 4
          description: >-
            How many of the current round's matches the creator has reported complete. Never
            greater than tournamentMatchesInRound. A count of FIXTURES, never of people, and
            no score, pairing, result or dispute note is carried.
        tournamentMatchesInRound:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 1
              maximum: 4
          description: >-
            How many matches the current round holds, derived as field >> round from the
            referenced lobby's seat count. The maximum of 4 is 8/2, the largest any round can
            be at 30.3's maximum field of 8.
    OverlayGiveawayTournamentResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, giveawayTournament]
      description: >-
        A null giveawayTournament is a valid answer, and is what an unrecognised, expired,
        revoked or foreign overlay token returns, what a channel with nothing running returns,
        what a closed giveaway and a concluded tournament return, and what a channel without
        the Creator+/Events Pack entitlement returns. All of them mean paint nothing, and
        there is deliberately no terminal state to distinguish.
      properties:
        schemaVersion: { type: string, const: v1 }
        giveawayTournament:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OverlayGiveawayTournament'
    Giveaway:
      type: object
      additionalProperties: false
      required: [schemaVersion, giveawayId, entryCount, entryOpensAt, entryClosesAt, closedAt, createdAt, updatedAt]
      description: >-
        Creator-facing giveaway. closedAt is a record of when the creator closed it (null
        while open), never a scheduled close and never a result - closing produces no
        announcement. It carries no draw method, seed, odds or weighting (17.1, decided
        2026-09-13: free-entry and skill-based formats only, supporter-weighted odds not
        built; GIV-07 stays Blocked), no winner, no prize description, value, escrow, custody,
        fulfilment, delivery, tracking, address or claim field (BharatStudio never holds,
        escrows, ships or guarantees a prize), no entry fee or price of any kind, and no
        entrant or participant list.
      properties:
        schemaVersion: { type: string, const: v1 }
        giveawayId:
          type: string
          format: uuid
          description: >-
            On the creator projection only, because the creator's write path is addressed
            rather than ambient. It is never on the overlay projection.
        entryCount: { type: integer, minimum: 0, maximum: 2147483647 }
        entryOpensAt: { type: string, format: date-time }
        entryClosesAt: { type: string, format: date-time }
        closedAt: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChannelGiveawayResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, giveaway]
      properties:
        schemaVersion: { type: string, const: v1 }
        giveaway:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Giveaway'
    OpenGiveawayRequest:
      type: object
      additionalProperties: false
      required: [entryClosesAt]
      description: >-
        The published entry window's close instant and nothing else. additionalProperties is
        false deliberately: a body carrying a draw method, a seed, odds, a weighting, a
        winner, a prize, an escrow flag, a shipping address, a claim URL, an entry fee, an
        entry method, a follow or supporter requirement, or a participant list is rejected
        before the store is reached. 17.1 forbids every one of them and none exists in the
        schema.
      properties:
        entryClosesAt: { type: string, format: date-time }
    UpdateGiveawayEntryCountRequest:
      type: object
      additionalProperties: false
      required: [entryCount]
      description: >-
        The creator-reported entry count. There is no entry path in this slice, so the number
        is as accurate as whoever reports it - stated rather than patched with an invented
        derivation, because deriving it would mean building the entry subsystem.
      properties:
        entryCount: { type: integer, minimum: 0, maximum: 2147483647 }
    Tournament:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - tournamentId
        - lobbySessionId
        - fieldSize
        - currentRound
        - totalRounds
        - completedMatchesInRound
        - matchesInRound
        - startedAt
        - concludedAt
        - createdAt
        - updatedAt
      description: >-
        Creator-facing tournament. 17.2 builds tournaments ON the Lobby Engine rather than
        beside it, so this REFERENCES a lobby session and fieldSize, totalRounds and
        matchesInRound are all derived from that lobby's seat count at read time rather than
        stored - which removes the class of drift where a tournament says 8 and its lobby says
        16. Single elimination only: 30.3 places "single elim, up to 8" at Creator+ and double
        elimination, round robin, points tables and seeding at Studio, and this slice carries
        one entitlement gate rather than two. It carries no winner, result, seed or randomness
        of any kind; no prize, escrow, custody, fulfilment, delivery, address or claim field;
        no participant, entrant, team, score, pairing, dispute note or sponsor field; and no
        bracket tree, which would need participant labels 16 ruled require an opt-in mechanism
        that does not exist. concludedAt is a record of when the creator concluded it, never a
        schedule and never an announcement.
      properties:
        schemaVersion: { type: string, const: v1 }
        tournamentId:
          type: string
          format: uuid
          description: On the creator projection only; never on the overlay projection.
        lobbySessionId:
          type: string
          format: uuid
          description: >-
            The lobby session this bracket runs on (17.2). On the creator projection only,
            where it lets a creator's own tooling see which session it is; never on the
            overlay projection, where a session id is prohibited.
        fieldSize:
          type: integer
          enum: [2, 4, 8]
          description: >-
            The referenced lobby's seat count, READ rather than stored. A power of two because
            single elimination without byes needs one, and byes belong to seeding which is not
            built; capped at 8 by 30.3.
        currentRound: { type: integer, minimum: 1, maximum: 3 }
        totalRounds: { type: integer, minimum: 1, maximum: 3, description: log2(fieldSize), derived and never stored. }
        completedMatchesInRound: { type: integer, minimum: 0, maximum: 4 }
        matchesInRound: { type: integer, minimum: 1, maximum: 4, description: fieldSize >> currentRound, derived and never stored. }
        startedAt: { type: string, format: date-time }
        concludedAt: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChannelTournamentResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, tournament]
      properties:
        schemaVersion: { type: string, const: v1 }
        tournament:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Tournament'
    StartTournamentRequest:
      type: object
      additionalProperties: false
      required: [lobbySessionId]
      description: >-
        The lobby session the bracket runs on, and nothing else. additionalProperties is false
        deliberately: the bracket's field size IS that lobby's seat count (17.2), so a body
        carrying a field size, bracket size, capacity, seeding, bracket type, participant
        list, team, score, dispute note, sponsor slot, winner, prize or entry fee is rejected
        before the store is reached.
      properties:
        lobbySessionId: { type: string, format: uuid }
    SetTournamentProgressRequest:
      type: object
      additionalProperties: false
      required: [currentRound, completedMatchesInRound]
      description: >-
        Both progress values, together. They are read together on one card, so a partial write
        would paint a round from one moment beside a match count from another. The maxima here
        are the outer bounds from 30.3's field of 8 (log2(8) rounds, 8/2 matches); the exact
        per-tournament bound comes from the referenced lobby's seat count and is enforced in
        the database, which is the only layer that can read that row. No score, pairing,
        result, winner or dispute note is accepted.
      properties:
        currentRound: { type: integer, minimum: 1, maximum: 3 }
        completedMatchesInRound: { type: integer, minimum: 0, maximum: 4 }
    OverlayMediaQueueEntry:
      type: object
      additionalProperties: false
      required: [schemaVersion, queueSlot, title, mediaKind, mimeType, playbackUrl, thumbnailPlaybackUrl, durationMs]
      description: >-
        One "current" or "next" queued media item. Metadata only (19.1), and no arbitrary
        third-party origin (9.1.1, migration 0148): playbackUrl / thumbnailPlaybackUrl are
        resolved server-side from a content-key fragment against the API's own configured CDN
        base, null whenever that base is unset (every environment today). No item id, no
        submitter and no viewer identity exists on this schema at all.
      properties:
        schemaVersion: { type: string, const: v1 }
        queueSlot: { type: string, enum: [current, next] }
        title: { type: string, minLength: 1, maxLength: 120 }
        mediaKind: { type: string, enum: [image, gif, video] }
        mimeType:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/gif, video/mp4, video/webm]
          description: >-
            A closed allow-list (9.1.1). No text/html, no image/svg+xml (inline script), no
            application/* of any kind.
        playbackUrl:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 2048
              pattern: '^https://'
          description: >-
            Resolved server-side against the API's OWN configured CDN base (19.1, migration
            0148) - never a caller- or database-supplied host. Null until that base is
            provisioned; the module renders nothing for an item with a null playbackUrl.
        thumbnailPlaybackUrl:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 2048
              pattern: '^https://'
        durationMs:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 0
              maximum: 2147483647
          description: >-
            Null for an image. The upper bound here is PostgreSQL integer's own range, a
            storage bound rather than a product one - the actual governing cap is a
            CONFIGURED-BUT-UNSET deployment value enforced at enqueue time, not on this read.
    OverlayMediaQueueResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, mediaQueue]
      description: >-
        AT MOST TWO entries, labelled "current" and "next" - 12.7's Overlay row authorises
        "current and next alert state" in those exact words, and this reuses the identical
        bound apps/web/app/overlay/canvas/modules/support-theater-module.ts already
        established for this codebase rather than inventing a queue-depth number. An empty
        array is what an unrecognised, expired, revoked or foreign overlay token returns, and
        also what a channel with nothing live in rotation returns - both mean paint nothing.
      properties:
        schemaVersion: { type: string, const: v1 }
        mediaQueue:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/OverlayMediaQueueEntry' }
    MediaQueueItem:
      type: object
      additionalProperties: false
      required: [schemaVersion, mediaQueueItemId, title, mediaKind, mimeType, gcsObjectKey, thumbnailGcsObjectKey, durationMs, status, enabled, createdAt, updatedAt]
      description: >-
        Creator-facing media queue item. CREATOR-ONLY (owner decision, 2026-09-17; MED-20):
        there is no submitter identity field anywhere on this type, because there is no
        submitter other than the creator - every row is written through the role-gated
        enqueue route alone. status carries PLAYBACK values only (queued/played/skipped),
        never a moderation decision such as approved/rejected/pending_review. Never
        tier-gated: available identically at every tier (12.6). gcsObjectKey /
        thumbnailGcsObjectKey are content-KEY fragments, never URLs (19.1, 9.1.1, migration
        0148).
      properties:
        schemaVersion: { type: string, const: v1 }
        mediaQueueItemId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        mediaKind: { type: string, enum: [image, gif, video] }
        mimeType:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/gif, video/mp4, video/webm]
        gcsObjectKey:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z0-9/_.-]{1,255}$'
          description: >-
            A content-key fragment (migration 0143's shape, mirrored by migration 0148) -
            never a URL. This character set cannot carry a scheme or a host.
        thumbnailGcsObjectKey:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 255
              pattern: '^[A-Za-z0-9/_.-]{1,255}$'
        durationMs:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 0
              maximum: 2147483647
        status: { type: string, enum: [queued, played, skipped] }
        enabled:
          type: boolean
          description: >-
            A creator-only pause switch. Pulling an item from the live rotation is never a
            delete (12.6): the durable row stays exactly as it is.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChannelMediaQueueItemResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, item]
      properties:
        schemaVersion: { type: string, const: v1 }
        item: { $ref: '#/components/schemas/MediaQueueItem' }
    ChannelMediaQueueListResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, items]
      description: >-
        Every status and every enabled/disabled item, forever (12.6) - never filtered or
        hidden by tier. Paginated at a page size the caller may bound up to 100, the same
        cursor-safety ceiling migration 0137's cursor reads already use.
      properties:
        schemaVersion: { type: string, const: v1 }
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MediaQueueItem' }
    EnqueueMediaQueueItemRequest:
      type: object
      additionalProperties: false
      required: [title, mediaKind, mimeType, gcsObjectKey]
      description: >-
        additionalProperties: false is load-bearing here, not boilerplate: it is where the
        owner's "creator-only, viewers cannot submit" decision is enforced on the wire. A body
        carrying submitterId, submittedBy, viewerId, approved, approvalStatus or
        rejectionReason is a 400 before the store is ever called, because none of those fields
        is declared. gcsObjectKey / thumbnailGcsObjectKey are content-KEY fragments, never
        URLs (19.1, 9.1.1, migration 0148): a value carrying a scheme or a host (any URL) is
        refused with 400, because ':' and '//' are outside the allowed character set - this is
        the fix for a prior hostile-review finding that this route accepted an arbitrary
        remote origin. Neither the media duration nor the number of items a channel may queue
        at once is bounded here beyond storage-column ranges: both are governed by a
        CONFIGURED-BUT-UNSET deployment cap enforced in the database, and exceeding either
        surfaces as 400 (duration) or 409 (queue-item-count) rather than being expressible in
        this schema, because neither number is decided or invented by this contract.
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        mediaKind: { type: string, enum: [image, gif, video] }
        mimeType:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/gif, video/mp4, video/webm]
          description: A closed allow-list (9.1.1). No text/html, no image/svg+xml, no application/* of any kind.
        gcsObjectKey:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^(?!.*\.\.)[A-Za-z0-9/_.-]{1,255}$'
          description: >-
            A content-key fragment (migration 0143's shape, mirrored by migration 0148) -
            never a URL. Resolved server-side against the configured CDN base; no bytes and no
            host are ever accepted here.
        thumbnailGcsObjectKey:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^(?!.*\.\.)[A-Za-z0-9/_.-]{1,255}$'
        durationMs: { type: integer, minimum: 0, maximum: 2147483647 }
    UpdateMediaQueueItemRequest:
      type: object
      additionalProperties: false
      required: [title, enabled]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        enabled: { type: boolean }
    SetMediaQueueItemStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      description: >-
        PLAYBACK lifecycle only. approved/rejected/pending_review/submitted-shaped values are
        refused by the enum itself, before the store is ever called.
      properties:
        status: { type: string, enum: [queued, played, skipped] }
    OverlaySoundboardPlay:
      type: object
      additionalProperties: false
      required: [schemaVersion, playId, clipKind, displayName, playbackUrl, mimeType, durationSeconds, triggeredAt]
      description: >-
        The single most recent creator-triggered soundboard play (6, module #6). Seven fields,
        12.7-bounded to the current trigger only - not a never-drop queue. No viewer, supporter
        or session identifier exists on this path, and none exists in the schema behind it
        either. playId is an opaque event id for client-side de-duplication only, never an
        identity.
      properties:
        schemaVersion: { type: string, const: v1 }
        playId: { type: string, format: uuid }
        clipKind: { type: string, enum: [catalogue, upload] }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        playbackUrl:
          oneOf:
            - type: 'null'
            - type: string
              format: uri
          description: >-
            Resolved by the API from a content-addressed GCS object key against the server's
            OWN configured CDN base (19.1) - never a caller- or database-supplied URL. Null
            whenever that base is not configured, which is every environment today.
        mimeType: { type: string, pattern: '^audio/[a-z0-9.+-]+$' }
        durationSeconds: { type: integer, minimum: 1 }
        triggeredAt: { type: string, format: date-time }
    OverlaySafeSoundboardResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, soundboardPlay]
      description: >-
        A null soundboardPlay is a valid answer, and is what an unrecognised, expired, revoked
        or foreign overlay token returns, what a channel that has triggered nothing returns,
        and what a channel without the 30.3 Pro+ entitlement returns.
      properties:
        schemaVersion: { type: string, const: v1 }
        soundboardPlay:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OverlaySoundboardPlay'
    SoundboardCatalogueEntry:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, externalKey, displayName, category, minTier, byteSize, durationSeconds, enabled, updatedAt]
      description: >-
        A first-party catalogue entry BharatStudio authors, metadata only (19.1: GCS/CDN,
        Postgres never holds the bytes - there is no byte payload anywhere on this schema).
        enabled reflects only this channel's own presence-based disable; it is never
        tier-gated (12.6) - what 30.3's Pro+ entitlement gates is whether the CANVAS renders
        the card, on the overlay read alone.
      properties:
        schemaVersion: { type: string, const: v1 }
        id: { type: string, format: uuid }
        externalKey: { type: string, minLength: 1, maxLength: 64 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, minLength: 1, maxLength: 60 }
        minTier: { type: string, enum: [free, pro, creator, studio] }
        byteSize: { type: integer, minimum: 1 }
        durationSeconds: { type: integer, minimum: 1 }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time }
    SoundboardCatalogueListResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, entries]
      properties:
        schemaVersion: { type: string, const: v1 }
        entries:
          type: array
          items: { $ref: '#/components/schemas/SoundboardCatalogueEntry' }
    ToggleSoundboardCatalogueEntryRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    SoundboardUpload:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, displayName, byteSize, durationSeconds, uploadedAt]
      description: >-
        A creator's own uploaded clip, metadata only (19.1). Playable the instant this record
        exists - there is no status, moderationState, approved or reviewedAt field anywhere in
        this schema for a clip to be pending in (2026-09-17 decision).
      properties:
        schemaVersion: { type: string, const: v1 }
        id: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        byteSize: { type: integer, minimum: 1 }
        durationSeconds: { type: integer, minimum: 1 }
        uploadedAt: { type: string, format: date-time }
    SoundboardUploadListResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, uploads]
      properties:
        schemaVersion: { type: string, const: v1 }
        uploads:
          type: array
          items: { $ref: '#/components/schemas/SoundboardUpload' }
    SoundboardUploadResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, upload]
      properties:
        schemaVersion: { type: string, const: v1 }
        upload: { $ref: '#/components/schemas/SoundboardUpload' }
    UploadSoundboardClipRequest:
      type: object
      additionalProperties: false
      required: [displayName, contentSha256, mimeType, byteSize, durationSeconds, rightsAttested]
      description: >-
        additionalProperties is false deliberately: a status, moderationState, approved,
        reviewed or reviewedAt field is a 400 before the store is reached - there is no state
        between "uploaded" and "playable" for a client to set. A client-supplied duration or
        size cap is likewise rejected; the server's own configured (today: unset) caps are the
        only ones that apply. byteSize/durationSeconds maxima are PostgreSQL integer's own
        range, a storage bound rather than a product one - the real cap is enforced server-side
        against configuration.
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        contentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        mimeType: { type: string, pattern: '^audio/[a-z0-9.+-]+$', maxLength: 100 }
        byteSize: { type: integer, minimum: 1, maximum: 2147483647 }
        durationSeconds: { type: integer, minimum: 1, maximum: 2147483647 }
        rightsAttested:
          type: boolean
          description: A positive rights attestation (18.2, AUD-06), recorded with a timestamp. false is a valid, explicit request the server refuses.
    TriggerSoundboardPlayRequest:
      type: object
      description: >-
        Exactly one of catalogueEntryId / uploadId - enforced by oneOf here and again in SQL
        (migration 0143's trigger_soundboard_play), which is the authority the SQL test proves
        against. Neither a supporter/viewer field nor a cooldown override exists here: every
        trigger in this slice is the creator's own, and no cooldown is decided anywhere in this
        repository.
      oneOf:
        - type: object
          additionalProperties: false
          required: [catalogueEntryId]
          properties:
            catalogueEntryId: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [uploadId]
          properties:
            uploadId: { type: string, format: uuid }
    TriggerSoundboardPlayResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, playId]
      properties:
        schemaVersion: { type: string, const: v1 }
        playId: { type: string, format: uuid }
    OverlaySponsorCard:
      type: object
      additionalProperties: false
      required: [schemaVersion, sponsorName, logoMimeType, logoStorageKey]
      description: >-
        Overlay-facing projection (6 module #11). Three fields, and that is the whole public
        surface of this module: what the card paints, and nothing about WHETHER, WHEN or HOW
        OFTEN it was painted. No impression, exposure, view, duration, "shown at" or
        "displayed at" field exists here or anywhere behind it (owner decision, 2026-09-17).
        logoMimeType and logoStorageKey are both present or both null together - the logo is
        optional. logoStorageKey is a tenant-scoped content-addressed reference
        (channelId + sha256, 19.1), never a URL and never third-party content (9.1.1).
      properties:
        schemaVersion: { type: string, const: v1 }
        sponsorName: { type: string, minLength: 1, maxLength: 120 }
        logoMimeType:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 120
        logoStorageKey:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 200
              description: channelId + '/' + the logo's sha256 content hash. Never a fetchable URL.
    OverlaySponsorCardResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, sponsorCard]
      description: >-
        A null sponsorCard is a valid answer, and is what an unrecognised, expired, revoked or
        foreign overlay token returns, what a disabled card returns, what a card outside its
        scheduled window returns, and what a channel with no sponsor card at all returns. All
        of them mean paint nothing.
      properties:
        schemaVersion: { type: string, const: v1 }
        sponsorCard:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OverlaySponsorCard'
    SponsorCard:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - sponsorCardId
        - sponsorName
        - logoContentSha256
        - logoMimeType
        - logoByteSize
        - logoStorageKey
        - enabled
        - scheduleStartsAt
        - scheduleEndsAt
        - createdAt
        - updatedAt
      description: >-
        Creator-facing sponsor card (6 module #11). One row per channel - there is no
        create/end lifecycle, only an upsert. Carries no impression, exposure, view, duration,
        "shown at" or "displayed at" field of any kind (owner decision, 2026-09-17: the card
        renders the sponsor and counts nothing). scheduleStartsAt/scheduleEndsAt are an
        instruction about the FUTURE - both null (no schedule) or both set (an absolute UTC
        window) - never a record of the past. Logo fields are all null together or all set
        together; logoStorageKey is generated in the database from channelId and
        logoContentSha256 and is never independently writable.
      properties:
        schemaVersion: { type: string, const: v1 }
        sponsorCardId: { type: string, format: uuid }
        sponsorName: { type: string, minLength: 1, maxLength: 120 }
        logoContentSha256:
          oneOf:
            - type: 'null'
            - type: string
              pattern: '^[0-9a-f]{64}$'
        logoMimeType:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 120
        logoByteSize:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 1
              description: A storage fact, not a product cap. No maximum is decided anywhere in this repository, so none is invented here.
        logoStorageKey:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 200
        enabled: { type: boolean }
        scheduleStartsAt: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        scheduleEndsAt: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChannelSponsorCardResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, sponsorCard]
      properties:
        schemaVersion: { type: string, const: v1 }
        sponsorCard:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SponsorCard'
    UpsertSponsorCardRequest:
      type: object
      additionalProperties: false
      required: [sponsorName, enabled, logoContentSha256, logoMimeType, logoByteSize, scheduleStartsAt, scheduleEndsAt]
      description: >-
        additionalProperties is false deliberately: a body carrying an impressionCount,
        exposureCount, viewCount, shownAt, displayedAt or duration field is rejected before the
        store is ever reached - the card renders the sponsor and counts nothing, and there is
        no field here for a client to even attempt to write one into. Logo fields must be all
        null or all set together; schedule fields must be both null or both set, with the end
        strictly after the start - both re-checked in the database.
      properties:
        sponsorName: { type: string, minLength: 1, maxLength: 120 }
        enabled: { type: boolean }
        logoContentSha256:
          oneOf:
            - type: 'null'
            - type: string
              pattern: '^[0-9a-f]{64}$'
        logoMimeType:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 120
        logoByteSize:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 1
        scheduleStartsAt: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        scheduleEndsAt: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
    StreamMission:
      type: object
      additionalProperties: false
      required: [schemaVersion, missionId, objective, startedAt, endedAt, createdAt, updatedAt]
      description: >-
        Creator-facing stream mission. endedAt is a record of when the creator ended the
        mission (null while it is running), never a scheduled end - the mission is
        session-bounded, not clock-bounded, and carries no duration or expiry.
      properties:
        schemaVersion: { type: string, const: v1 }
        missionId: { type: string, format: uuid }
        objective: { type: string, minLength: 1, maxLength: 120 }
        startedAt: { type: string, format: date-time }
        endedAt: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChannelStreamMissionResponse:

  /v1/overlay-widgets/{overlayId}/lobby-status:
    get:
      tags: [Overlay]
      operationId: getOverlayLobbyStatus
      summary: Aggregate lobby status - seats, confirmed seats and a queue count.
      description: >-
        Master Canvas module #16 (Lobby Status). 16 is explicit that the public overlay shows
        "aggregate status only: '8/16 seats confirmed', queue count ... Never player
        identifiers, never Discord names, never codes or passwords."

        That is a property of the read, not of the renderer: the returned column set is three
        integers. No room code, no password, no seat token, no player identifier, no in-game
        name, no Discord name, no viewer id, no anonymous identity and no session id exists on
        this path - and none exists in the schema behind it either, so there is nothing for a
        future read to start returning and nothing that can correlate one visit to another.
        Opted-in initials and avatars are permitted by 16 but are out of scope here: they
        require an opt-in mechanism that does not exist.

        Bounded to the channel's CURRENT lobby and never a history (12.7). Entitlement is
        Creator+ or the Events Pack (30.3): the check lives inside the read, so an unentitled
        channel's valid overlay token returns null. An unrecognised, expired, revoked or
        foreign token returns null too, as does a channel with no open lobby - all of them
        mean paint nothing.
      security: [{ overlayToken: [] }]
      parameters:
        - $ref: '#/components/parameters/OverlayId'
      responses:
        '200':
          description: Token-scoped aggregate lobby status for this overlay, or null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverlayLobbyStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }

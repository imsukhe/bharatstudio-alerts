apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bharatstudio-alerts-api
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      serviceAccountName: bsa-alerts-api
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/bharatstudio/alerts-api:RELEASE_DIGEST
          ports:
            - name: http1
              containerPort: 4100
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: APP_ORIGIN
              value: https://alerts.bharatstudio.in
            - name: DATABASE_URL_APP
              valueFrom: { secretKeyRef: { name: bsa-database-url-app, key: current } }
            - name: DATABASE_URL_DIRECT
              valueFrom: { secretKeyRef: { name: bsa-database-url-direct, key: current } }
            - name: PUBLIC_PAYMENT_TURNSTILE_REQUIRED
              value: "true"
          startupProbe:
            httpGet: { path: /healthz, port: 4100 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 4100 }
            periodSeconds: 15

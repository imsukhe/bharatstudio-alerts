        viewing and exporting a durable creator record is never tier-gated (12.6). The 30.3
        Creator+/Events Pack entitlement governs only whether the Master Canvas renders the
        Lobby Status card.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: The channel's current lobby session, or null when none is open.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelLobbySessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/RetryableFailure' }
    post:
      tags: [Lobby]
      operationId: openChannelLobbySession
      security: [{ bearerAuth: [] }]
      description: >-
        Opens a lobby session. Owner/admin only, and not tier-gated. At most one lobby may be

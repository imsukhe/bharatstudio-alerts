    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OverlayId:
      name: overlayId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StreamMissionId:
      name: missionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GoalId:
      name: goalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChangeRequestId:
      name: changeRequestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CapabilityKey:
      name: capabilityKey
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,99}$' }
    SafetyCorpusTermId:
      name: termId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LobbySessionId:
      name: lobbyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GiveawayId:
      name: giveawayId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TournamentId:
      name: tournamentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaQueueItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SoundboardEntryId:
      name: entryId
      in: path
      required: true

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bharatstudio-payment-webhook
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      serviceAccountName: bsa-payment-webhook
      containerConcurrency: 40
      timeoutSeconds: 30
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/bharatstudio/payment-webhook:RELEASE_DIGEST
          ports: [{ name: http1, containerPort: 8080 }]
          env:
            - name: PAYMENT_ENVIRONMENT
              value: live
            - name: PAYMENT_DATABASE_URL
              valueFrom: { secretKeyRef: { name: bsa-payment-database-url, key: current } }
            - name: ALERT_WORKER_PUMP_URL
              value: https://bharatstudio-alert-worker-PROJECT.REGION.run.app/internal/v1/tasks/pump
            - name: ALERT_WORKER_PUMP_AUDIENCE
              value: https://bharatstudio-alert-worker-PROJECT.REGION.run.app
            - name: ALERT_WORKER_PRIVATE_AUDIENCE
              value: https://bharatstudio-alert-worker-PROJECT.REGION.run.app
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
